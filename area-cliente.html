// AS DUAS LINHAS DOS OBJETIVOS. Em cima, quando a família sonha realizar cada objetivo; embaixo, quando ele chega com o
// dinheiro que vai para o futuro. O controle muda quanto vai por mês (o que sai do presente) e soma uma renda extra; os

const itensDasLinhas = () => objetivos().filter(o => o.valor > 0 && o.data).sort((a, b) => (a.tipo === 'liberdade') - (b.tipo === 'liberdade') || (a.data < b.data ? -1 : 1));

const aporteDeHoje = itens => soma(itens.map(o => o.aporte || 0));

// publicado que fecha, o aporte do plano); o que passa disso vai para os que ainda estão atrasados. Quando todos estão no
// teto, o resto não tem para onde ir: é o que não precisa ser poupado
function simularLinhas(itens, total) {
  const base = aporteDeHoje(itens), anc = liberdadeAncorada();
  const st = itens.map(o => { const g = guardado(o.id); return { w: base ? o.aporte || 0 : 1, fixo: o.aporte || 0, s: g, r: o.taxa || 0, v: o.valor, lib: o.tipo === 'liberdade', n: difM(MES, o.data), a: 0, fim: g >= o.valor - 0.5 ? 0 : null }; });
  const teto = (x, k) => { if (anc && x.lib) return x.fixo; const n = x.n - k + 1; if (n <= 0) return Infinity;
    const c = Math.pow(1 + x.r, n), falta = x.v - x.s * c; return falta <= 0 ? 0 : x.r ? falta * x.r / (c - 1) : falta / n; };
  const reparte = (grupo, valor) => { const W = soma(grupo.map(x => x.w)); grupo.forEach(x => { x.a += W ? valor * x.w / W : valor / grupo.length; }); };
  for (let k = 1; k <= 600 && st.some(x => x.fim == null); k++) {
    const vivos = st.filter(x => x.fim == null); vivos.forEach(x => { x.a = 0; x.t = Math.max(0, teto(x, k)); });
    let livres = vivos, resto = total;
    while (resto > 0.01 && livres.length) { reparte(livres, resto); resto = 0;
      livres.forEach(x => { if (x.a > x.t) { resto += x.a - x.t; x.a = x.t; } }); livres = livres.filter(x => x.a < x.t); }
    vivos.forEach(x => { x.s = x.s * (1 + x.r) + x.a; if (x.s >= x.v - 0.5) x.fim = k; });

// a liberdade do plano publicado que fecha: a data é a do plano (que conta o crescimento da renda); o controle só move a
// diferença em relação ao ritmo de hoje
const liberdadeAncorada = () => R.degrau === 'completo' && RS && RS.liberdade && RS.liberdade.idade != null && !RS.liberdade.forcada;
function datasDasLinhas(itens, total) {
  const f = simularLinhas(itens, total), hoje = liberdadeAncorada() ? simularLinhas(itens, aporteDeHoje(itens)) : null;
  return itens.map((o, i) => f[i] == null ? null : maxM(o.data, o.tipo === 'liberdade' && hoje && hoje[i] != null ? addM(o.data, f[i] - hoje[i]) : addM(MES, f[i])));
}
// o ritmo de hoje, uma vez por desenho, para o Painel e os Objetivos dizerem o mesmo
let PREV_CACHE = null;
function previsoesDeHoje() {
  if (PREV_CACHE) return PREV_CACHE;
  const itens = itensDasLinhas(), d = datasDasLinhas(itens, aporteDeHoje(itens));
  return PREV_CACHE = Object.fromEntries(itens.map((o, i) => [o.id, d[i]]));
}
const atrasoTxt = d => d === 0 ? 'na data' : d < 0 ? `${-d >= 24 ? Math.round(-d / 12) + ' anos' : -d + (d === -1 ? ' mês' : ' meses')} antes da data` : `${d >= 24 ? Math.round(d / 12) + ' anos' : d + (d === 1 ? ' mês' : ' meses')} depois da data`;
// o total que põe todos os sonhos na data, procurado entre zero e a renda inteira; null quando nem a renda inteira fecha
function totalQueFecha(itens) {
  const fecha = t => datasDasLinhas(itens, t).every((d, i) => d != null && d <= itens[i].data);
  let lo = 0, hi = Math.max(renda(), aporteDeHoje(itens) * 4);
  if (!fecha(hi)) return null;

function estadoDasLinhas(itens, L, ini, fim) {
  const datas = datasDasLinhas(itens, L.d + (L.extra ? L.e : 0)), span = Math.max(1, difM(ini, fim)), x = m => clamp(difM(ini, m) / span, 0, 1) * 100;
  return itens.map((o, i) => { const p = datas[i], d = p ? difM(o.data, p) : null;
    return { i, sonho: x(o.data), plano: p ? x(p) : 100, nunca: !p, d, chip: !p ? ['at', 'não chega em 50 anos'] : d > 0 ? ['at', atrasoTxt(d)] : ['ok', atrasoTxt(d)],
      txt: `sonho ${mesAno(o.data + '-01')}${idadeEm_(o.data)} · plano ${p ? mesAno(p + '-01') + idadeEm_(p) : 'depois de 50 anos'}` }; });
}
// a idade num mês: pela data de nascimento, quando o plano a tem (a mesma conta da "liberdade aos 57"); sem ela, a idade de hoje mais os anos

    : L.d + (L.extra ? L.e : 0) > fecha ? `Todos chegam na data com ${brl(Math.max(0, fecha - (L.extra ? L.e : 0)))} por mês${L.extra && L.e ? ', somando a renda extra' : ''}. O que passar disso não adianta nenhum objetivo.`
    : `Para todos chegarem na data: ${brl(Math.max(0, fecha - (L.extra ? L.e : 0)))} por mês${L.extra && L.e ? ', somando a renda extra' : ''}.`;

function linhasDosObjetivos() {
  const itens = itensDasLinhas(); if (!itens.length) return '';

  if (!UI.linhas || UI.linhas.base !== base) UI.linhas = { base, d: base, e: 0, extra: false };
  const L = UI.linhas, min = Math.max(0, Math.floor(base * 0.5 / 50) * 50), max = Math.ceil(Math.max(base * 2.5, (fecha || 0) * 1.15, base + 500) / 50) * 50;

// o patrimônio previsto num mês: no Completo, o da simulação da versão vigente; nos outros, o de hoje mais o que se planeja guardar

function telaRealizado() {
  const orc = Object.entries(X.realizado.orcamento || {}).filter(([m]) => m < MES).sort(), pat = Object.entries(X.realizado.patrimonio || {}).filter(([m]) => m <= MES).sort();

    const svg = pts.length > 1 ? curva(pts, { W: 640, H: 180, reais, eixo: [mesAno(ini + '-01'), mesAno(fim + '-01')], rotulo: 'O patrimônio previsto e o real' }).replace('</svg>', trocas.map(k => { const x = 6 + (628) * k / (pts[pts.length - 1].x || 1); return `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="4" y2="160" stroke="var(--marinho)" stroke-dasharray="4 3" stroke-width="1.5"><title>plano ajustado em ${dataBRano(vs[1].em.slice(0, 10))}</title></line>`; }).join('') + '</svg>') : '';

    if (!m) return { titulo: 'Renovação do planejamento', texto: `O ano do plano se fechou. A renovação é combinada ${comA()}.` };

      texto: m[1].lembrete > HOJE ? `Previsto para ${dataBRano(m[1].data)}. O lembrete para agendar chega no WhatsApp em ${dataBRano(m[1].lembrete)}, duas semanas antes.` : `Previsto para ${dataBRano(m[1].data)}. Já dá para agendar ${comA()}.` };

// grava no vetor nem muda o plano. O resultado se refaz enquanto a pessoa digita ----------
const utilNum = (k, padrao) => { const v = numero((UI.util || {})[k]); return v == null ? padrao : v; };
const campoUtil = (k, rot, padrao, moeda, ajuda) => `<div class="campo"><label for="u-${k}">${rot}</label><input id="u-${k}" inputmode="decimal"${moeda ? ' data-moeda' : ''} data-util="${k}" value="${esc((UI.util || {})[k] != null ? (UI.util || {})[k] : padrao)}">${ajuda ? `<small>${ajuda}</small>` : ''}</div>`;
function resUtilInv() {
  const v = utilNum('inv.valor', 100000), tx = utilNum('inv.taxa', 12) / 100, inf = utilNum('inv.inflacao', 4.5) / 100, ir = utilNum('inv.ir', 15) / 100, anos = Math.max(0, utilNum('inv.anos', 10));
  const liq = tx * (1 - ir), real = (1 + liq) / (1 + inf) - 1;
  return `<b class="num" style="font-size:22px">${nf1.format(real * 100)}% ao ano</b> acima da inflação, depois do imposto (${nf1.format(liq * 100)}% líquido). Em ${nf1.format(anos)} ${anos === 1 ? 'ano' : 'anos'}, ${brl(v)} viram ${brl(v * Math.pow(1 + real, anos))} em poder de compra de hoje.`;
}
function resUtilImo() {
  const v = utilNum('imo.valor', 500000), al = utilNum('imo.aluguel', 2500), cu = utilNum('imo.custos', 300), vago = Math.min(12, Math.max(0, utilNum('imo.vago', 1))), ir = utilNum('imo.ir', 15) / 100, val = utilNum('imo.valorizacao', 0) / 100;
  const liq = al * (12 - vago) * (1 - ir) - cu * 12, y = v > 0 ? liq / v : 0;
  return `<b class="num" style="font-size:22px">${nf1.format(y * 100)}% ao ano</b> de aluguel líquido sobre o valor do imóvel: ${brl(liq)} por ano, ${brl(liq / 12)} por mês. Com a valorização acima da inflação, ${nf1.format((y + val) * 100)}% ao ano.`;
}
