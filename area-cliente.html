// ---------- Realizado: o orçado × o realizado do orçamento e do patrimônio, cada mês contra a versão que valia nele ----------
// O orçado de um mês: no Completo, o fluxo de caixa da versão vigente; na clínica, a renda, as fixas, o teto das ajustáveis e
// os aportes combinados; no cadastrado, o orçamento que ele informou
function orcadoNoMes(mes) {
  const v = versaoNoMes(mes), rs = v && RES[v.n];
  if (rs) { const f = rs.fluxo.find(x => x.mes === mes); if (f) return Object.assign({ versao: 'o plano de ' + dataBRano(v.em) }, f); }
  if (!tem(fv('renda')) || !tem(fv('fixas'))) return null;
  const teto = R.pedidos.find(p => p.id === 'teto'), aj = teto ? teto.tetoMes : +fv('ajustaveis');
  const fx = +fv('fixas'), e = +fv('renda');
  return { mes, entradas: e, fixas: fx, ajustaveis: aj, futuro: e - fx - aj, versao: R.degrau === 'clinica' ? 'a clínica de ' + dataBRano(C.publicadaEm) : 'o orçamento que ' + pl('vocês informaram', 'você informou') };
}
// o patrimônio previsto num mês: no Completo, o da simulação da versão vigente; nos outros, o de hoje mais o que se planeja guardar
function patrimonioPrevisto(mes) {
  const v = versaoNoMes(mes), rs = v && RES[v.n];
  if (rs) { const p = rs.patrimonio.porMes[mes]; return p ? p.total : null; }
  const base = Object.keys(X.realizado.patrimonio || {}).sort()[0]; if (!base || !tem(fv('renda'))) return null;
  const b = X.realizado.patrimonio[base], k = difM(base, mes);   // o primeiro registro, mais a sobra de cada mês rendendo a taxa real
  return k < 0 ? null : fvDe(b.financeiro, Math.max(0, sobra()), TAXA_REAL, k) + b.bens + b.participacoes - b.dividas;
}
function telaRealizado() {
  const orc = Object.entries(X.realizado.orcamento || {}).filter(([m]) => m < MES).sort(), pat = Object.entries(X.realizado.patrimonio || {}).filter(([m]) => m <= MES).sort();
  const vs = versoesVigentes().slice().reverse(), desde = vs.length ? vs[0].em.slice(0, 7) : R.publicadaEm ? R.publicadaEm.slice(0, 7) : orc.length ? orc[0][0] : MES;
  // só os horizontes que mostram algo a mais: 6 e 12 meses quando já há mais de 3 e de 6; o ano quando ele tem registro
  const hz = !orc.length ? [] : [['3', 3], ['6', 6], ['12', 12], ['ano', MES.slice(0, 4) + '-01'], ['plano', desde]].filter(([k, x]) => k === '3' || k === 'plano' || (k === '6' ? orc.length > 3 : k === '12' ? orc.length > 6 : orc.some(([m]) => m >= x)));
  const H = UI.horizonte && hz.some(h => h[0] === UI.horizonte) ? UI.horizonte : hz.length ? hz[hz.length - 1][0] : null, hv = (hz.find(h => h[0] === H) || [])[1];
  const meses = orc.filter(([m]) => typeof hv === 'number' ? m >= addM(MES, -hv) : m >= hv);
  // as versões do plano: cada uma com a data e o que mudou
  const versoes = vs.length ? vs.map((v, i) => ({ em: v.em, nome: i ? 'Plano ajustado' : 'Plano apresentado', txt: v.comentario }))
    : R.degrau === 'clinica' ? [{ em: C.publicadaEm, nome: 'Clínica financeira', txt: `${C.orientacoes.length} orientações combinadas com a ${C.consultora.completo}` }]
      .concat(ajustesDoPlano().filter(j => j.saida !== 'versao').map(j => ({ em: j.em, nome: 'Ajuste de ' + pl('vocês', 'você'), txt: `${(objDe(j.obj) || {}).nome}: ${j.campo === 'aporte' ? brl(j.de) + ' → ' + brl(j.para) : mesAno(j.de + '-01') + ' → ' + mesAno(j.para + '-01')} (${SAIDAS[j.saida] || 'ajuste'})` }))) : [];
  const cabVersoes = versoes.length ? `<div class="card"><h3>Contra qual plano</h3><p class="mut" style="margin:0 0 6px">Cada mês é comparado com a versão do plano que valia nele; o passado nunca é recomparado com o plano novo.</p>${versoes.map(v => `<div class="etapa feita"><span class="p"></span><div><b>${esc(v.nome)}</b> <span class="mut">${dataBRano(v.em.slice(0, 10))}</span><div class="mut">${esc(v.txt || '')}</div></div></div>`).join('')}</div>` : '';
  // a mesa: um cartão por mês, o orçado e o realizado lado a lado
  const linha = (n, o, r, inverso) => { const d = r - o, ruim = inverso ? d < -0.5 : d > 0.5; return `<div class="l"><span>${n}</span><span>${brl(o)}</span><b style="${Math.abs(d) > Math.max(50, o * 0.03) ? (ruim ? 'color:var(--atencao-txt)' : 'color:var(--verde-txt)') : ''}">${brl(r)}</b></div>`; };
  let tot = { o: 0, r: 0, n: 0 };
  const mesa = meses.slice().reverse().map(([m, r]) => { const o = orcadoNoMes(m); if (!o) return ''; const fut = r.entradas - r.fixas - r.ajustaveis; tot.o += o.futuro; tot.r += fut; tot.n++;
    const d = fut - o.futuro, est = Math.abs(d) <= Math.max(100, Math.abs(o.futuro) * 0.05) ? ['', 'dentro do plano'] : d > 0 ? ['ok', 'acima do plano'] : ['at', 'abaixo do plano'];
    return `<div class="mes"><h4><span>${MESES_L[+m.slice(5) - 1]} de ${m.slice(0, 4)}</span><span class="chip ${est[0]}">${est[1]}</span></h4><div class="l cab"><span></span><span>orçado</span><b>realizado</b></div>
      ${linha('Entradas', o.entradas, r.entradas, true)}${linha('Fixas', o.fixas, r.fixas)}${linha('Ajustáveis', o.ajustaveis, r.ajustaveis)}${linha('Para o futuro', o.futuro, fut, true)}
      <div class="mut" style="margin-top:6px;font-size:11.5px">contra ${esc(o.versao)} · ${esc(r.origem || '')}</div></div>`; }).join('');
  const resumoOrc = tot.n ? (() => { const d = tot.r - tot.o; return `<div class="nums"><div><span>Planejado para o futuro</span><b>${brlC(tot.o)}</b><small>em ${tot.n} ${tot.n === 1 ? 'mês' : 'meses'}</small></div><div><span>Realizado</span><b class="${d >= -0.5 ? 'ok' : 'fut'}">${brlC(tot.r)}</b><small>${Math.abs(d) <= Math.max(100, Math.abs(tot.o) * 0.03) ? 'dentro do plano' : d > 0 ? brlC(d) + ' acima do plano' : brlC(-d) + ' abaixo do plano'}</small></div><div><span>Meses dentro ou acima</span><b>${meses.filter(([m, r]) => { const o = orcadoNoMes(m); return o && r.entradas - r.fixas - r.ajustaveis >= o.futuro - Math.max(100, Math.abs(o.futuro) * 0.05); }).length} de ${tot.n}</b><small>no horizonte escolhido</small></div></div>`; })() : '';
  // o patrimônio: a curva prevista (a de cada versão, no seu trecho) e os pontos reais
  let grafPat = '';
  if (pat.length) { const ini = vs.length ? addM(vs[0].em.slice(0, 7), 0) : pat[0][0], fim = addM(MES, 2), pts = [];
    for (let m = ini; m <= fim; m = addM(m, 1)) { const p = patrimonioPrevisto(m); if (p != null) pts.push({ x: difM(ini, m), y: p }); }
    const reais = pat.map(([m, v]) => ({ x: difM(ini, m), y: v.financeiro + v.bens + v.participacoes - v.dividas, t: `${mesAno(m + '-01')}: ${brlC(v.financeiro + v.bens + v.participacoes - v.dividas)} (${v.origem || ''})` }));
    const [um, uv] = pat[pat.length - 1], ur = uv.financeiro + uv.bens + uv.participacoes - uv.dividas, up = patrimonioPrevisto(um);
    const trocas = vs.slice(1).map(v => difM(ini, v.em.slice(0, 7)));
    const svg = pts.length > 1 ? curva(pts, { W: 640, H: 180, reais, eixo: [mesAno(ini + '-01'), mesAno(fim + '-01')], rotulo: 'O patrimônio previsto e o real' }).replace('</svg>', trocas.map(k => { const x = 6 + (628) * k / (pts[pts.length - 1].x || 1); return `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="4" y2="160" stroke="var(--marinho)" stroke-dasharray="4 3" stroke-width="1.5"><title>plano ajustado em ${dataBRano(vs[1].em.slice(0, 10))}</title></line>`; }).join('') + '</svg>') : '';
    grafPat = `<div class="card"><h3>O patrimônio</h3><p class="peq" style="margin:0 0 8px;color:var(--marinho)">${mesAnoL(um)}: ${brlC(ur)}${up != null ? ` · o plano previa ${brlC(up)}: ${Math.abs(ur - up) <= up * 0.01 ? 'dentro do plano' : ur > up ? brlC(ur - up) + ' acima' : brlC(up - ur) + ' abaixo'}` : ''}</p>${svg}${legenda([['previsto', 'var(--marinho)'], ['real', 'var(--laranja)']].concat(trocas.length ? [['troca de versão', null]] : []))}</div>`; }
  // o dinheiro dedicado aos objetivos, no ritmo das tarefas
  const aps = ocorrencias().filter(o => o.pedido.id === 'aporte' && o.data <= HOJE), plan = soma(aps.map(o => o.valor)), feito = soma(aps.map(o => soma(Object.values(feitoPorObjetivo(o)))));
  const dedicado = aps.length ? `<div class="card"><h3>O dinheiro dedicado aos objetivos</h3><div class="num" style="font-size:22px">${brl(feito)} <span class="mut" style="font-family:var(--sans)">de ${brl(plan)} planejados</span></div><div class="trilho" style="margin:8px 0"><i style="width:${plan ? (clamp(feito / plan, 0, 1) * 100).toFixed(1) : 0}%"></i></div><div class="mut">${aps.slice(-12).map(a => `${MESES[+a.mes.slice(5) - 1]}: ${a.aberta ? 'aguardando' : estadoTxt(a)}`).join(' · ')}</div></div>` : '';
  const vazio = !orc.length && !pat.length && !aps.length;
  const seletor = hz.length > 1 ? `<div class="filtros">${hz.map(([k]) => `<button class="filtro${k === H ? ' on' : ''}" data-acao="horizonte" data-v="${k}">${{ 3: '3 meses', 6: '6 meses', 12: '12 meses', ano: 'o ano', plano: 'desde o plano' }[k]}</button>`).join('')}</div>` : '';
  return `<div style="max-width:1080px">${vazio ? `<div class="aviso" style="margin-bottom:12px">O realizado começa no primeiro registro. ${R.degrau === 'visitante' ? 'Com a conta, ' + pl('vocês lançam', 'você lança') + ' o mês aqui (ou o open banking traz sozinho, quando estiver ligado).' : 'Lance o primeiro mês: a área compara com o plano que valia nele.'}</div>` : ''}
    <div class="grade2" style="align-items:start">${cabVersoes || '<div></div>'}${dedicado}</div>
    ${orc.length ? `<div class="rotulo">O orçamento: o orçado e o realizado</div>${seletor}${resumoOrc}<div class="mesa">${mesa}</div>` : ''}
    ${grafPat ? `<div class="rotulo">O patrimônio: o previsto e o real</div>${grafPat}` : ''}
    ${R.degrau !== 'visitante' ? `<div style="margin-top:14px"><button class="btn" data-acao="lancar">Lançar um mês</button></div>` : ''}</div>`;
}

// ---------- O atendimento (decisão de 30/10): o nível de serviço de cada degrau, quem atende e o próximo encontro, com o

// a agenda dos planejadores ainda não tem endereço: sem ele, o botão diz o que fará no produto
const LINKS = { agenda: null, comite: 'https://members.nordinvestimentos.com.br/conteudo/326-nord-alocacao' };
const ANTECEDENCIA = 14;   // dias antes do acompanhamento em que o lembrete para agendar chega

  { id: 'clinica', nome: 'Clínica financeira', ritmo: 'Check-up anual, 12 meses depois da clínica',
    inclui: ['Tudo da plataforma', 'Uma conversa com um planejador da Nord, que escolhe o foco e deixa as primeiras tarefas', 'O apoio desse planejador pelas mensagens daqui'] },
  { id: 'completo', nome: 'Planejamento completo', ritmo: 'Acompanhamento semestral',

function calendarioCompleto(vs) {

  const ord = vs.slice().reverse(), apres = ord[0].em.slice(0, 10), marco = (k, meses) => {
    const data = ord[k] ? ord[k].em.slice(0, 10) : maisMeses(apres, meses); return { data, feito: !!ord[k], lembrete: addD(data, -ANTECEDENCIA) }; };
  return { apres, acomp1: marco(1, 6), anual: marco(2, 12) };

const comA = () => R.consultora ? 'com a ' + R.consultora.nome : 'com um planejador da Nord';

function mascaraMoeda(ev) {

  // colado com ponto decimal ("2500.5"): o último ponto seguido de um ou dois dígitos é a vírgula
  else if (!v.includes(',') && /\.\d{1,2}$/.test(v)) { const k = v.lastIndexOf('.'); v = v.slice(0, k) + ',' + v.slice(k + 1); }

  if (ev.inputType === 'deleteContentBackward' && ant[pos] === '.' && v === ant.slice(0, pos) + ant.slice(pos + 1) && pos > 0) { v = v.slice(0, pos - 1) + v.slice(pos); pos--; }
  if (ev.inputType === 'deleteContentForward' && ant[pos] === '.' && v === ant.slice(0, pos) + ant.slice(pos + 1)) v = v.slice(0, pos) + v.slice(pos + 1);
  const antes = v.slice(0, pos).replace(/[^\d,]/g, '').replace(/^0+(?=\d)/, '').length;
  const s = v.replace(/[^\d,]/g, ''), i = s.indexOf(',');
  const inteiro = (i < 0 ? s : s.slice(0, i)).replace(/^0+(?=\d)/, ''), dec = i < 0 ? null : s.slice(i + 1).replace(/,/g, '').slice(0, 2);

}
