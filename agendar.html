<title>Agendar · Nord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Sora:wght@500;600&display=swap" rel="stylesheet">
<!--
  A página de quem agenda (especificação: area-logada/AGENDAMENTO.md › "A experiência de quem agenda"), primeiro no
  celular, porque o link chega pelo WhatsApp.
    agendar.html?t=<endereço>             o link público de um tipo: escolher o horário, dizer quem é, confirmar
    agendar.html?ag=<id>&code=<código>    a reunião marcada: ver, remarcar e cancelar (&acao=remarcar | cancelar)
    &ver=equipe                           aberta pelo painel ("Ver como o cliente vê"): não conta como abertura
    agendar.html?id=<id>&code=<código>    o link pessoal, de uso único: já sabe quem é a pessoa
    agendar.html?interno=<tipo>&cliente=<id>   da área logada (o cliente da sessão; aberta por cima da área do cliente)
    agendar.html?pelo=<cliente>&tipo=<tipo>&por=<pessoa>   o consultor agendando pelo cliente, no painel
    &area=<cliente>                       mostra "Voltar à sua área" (a página aberta pela área do cliente)
  Nos três jeitos de quem já é conhecido, não há formulário de identificação: nome, WhatsApp e e-mail vêm do cadastro
  (SIMULADO: agClientes), e o aceite das mensagens é o do cadastro. Só as perguntas do tipo aparecem.

  Decisões tomadas na construção (também em AGENDAMENTO.md › "Decidido na construção do protótipo"):
  - Os horários são sempre de Brasília (pedido do dono do produto em 10/11/2026): a página diz isso e não deixa trocar
    o fuso, e as mensagens também saem em Brasília.
  - O calendário não mostra ninguém da equipe; ao escolher um horário, a reserva já distribui e a página mostra quem
    vai atender, com a foto e a mini bio (pedido do dono do produto em 10/11/2026). A confirmação fica com essa pessoa,
    se continuar livre; só o dono do contato no pipeline, livre, passa à frente.
  - As perguntas do tipo têm tipo de resposta: texto curto, texto longo, escolha única, várias escolhas, lista e data.
  - O limite por número: um WhatsApp tem no máximo uma reunião futura de cada tipo pelo link público; quem tenta de novo
    vê a que já tem, com remarcar e cancelar (regra no motor).
  - O e-mail é obrigatório (é para onde vai a confirmação com o convite do calendário); o aceite do WhatsApp é opcional,
    junto ao botão, e sem ele as mensagens vão por e-mail.
  - O calendário começa no domingo e abre no primeiro dia com horário; os horários do dia vêm em manhã (até 12h),
    tarde (até 18h) e noite.
  - Escolher um horário já o reserva por 5 minutos (antes do formulário). Se a reserva vence, nada se perde: ao
    confirmar, o calendário é conferido de novo.
  - Cancelar pede o motivo numa lista curta (e "outro", com texto); remarcar mostra só os horários da mesma pessoa e, sem
    nenhum em 7 dias, os da equipe, com o aviso de que quem atende pode mudar.
  - "Adicionar ao calendário" tem o Google Agenda (link) e o convite .ics (para Outlook, Apple e os outros).
  - Na simulação, a distribuição e a confirmação rodam aqui no navegador; na plataforma, no servidor.
-->
<style>
:root{
  --laranja:#FA7A35; --laranja-texto:#E06600; --pessego:#FFF3EB; --marinho:#20344C; --marinho-noite:#131F2E;
  --creme:#FDFCFA; --branco:#FFFFFF; --grafite:#555555; --legenda:#6B6A66; --areia:#F1EEE8; --borda:#DDDDDD;
  --ardosia:#DCE3EC; --verde:#2E9E5B; --verde-texto:#22794A; --vermelho-texto:#B53434; --atencao:#964400; --trilho:#EEF1F5;
  --sombra:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  --sombra-flut:0 20px 50px rgba(0,0,0,.25);
  --sans:'DM Sans',system-ui,sans-serif; --display:'Sora',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--creme);color:var(--grafite);font:400 15px/1.6 var(--sans);min-height:100vh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--marinho)}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}
[hidden]{display:none!important}

.topo{padding:18px 16px 6px;display:flex;justify-content:center}
.voltar-area{max-width:980px;margin:0 auto;padding:10px 16px 0}
.topo img{height:30px;width:auto}
.equipe-faixa{background:var(--ardosia);color:var(--marinho);font-size:13px;text-align:center;padding:8px 16px}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:12px 16px 40px}
footer{text-align:center;font-size:12.5px;color:var(--legenda);padding:0 16px 28px}

.cartao{background:var(--branco);border-radius:16px;box-shadow:var(--sombra);padding:22px 20px}
.duas{display:grid;gap:16px}
@media (min-width:860px){
  main{padding-top:24px}
  .duas{grid-template-columns:320px minmax(0,1fr);align-items:start}
  .duas > .info{position:sticky;top:20px}
}

.rotulo{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--marinho)}
h1{font:600 26px/1.2 var(--display);color:var(--marinho);margin-top:6px;overflow-wrap:anywhere}
@media (min-width:860px){h1{font-size:28px}}
@media (max-width:859px){.so-form .info{display:none}.info h1{font-size:23px}}
h2{font:600 17px/1.3 var(--display);color:var(--marinho)}
.info .desc{margin-top:10px}
.fatos{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--marinho)}
.fatos li{display:flex;gap:10px;align-items:center}
.fatos svg{flex:0 0 18px;color:var(--legenda)}
.nota{font-size:13px;color:var(--legenda);line-height:1.55}
.divisa{border:0;border-top:1px solid var(--areia);margin:18px 0}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:10px 14px;font:600 14px var(--sans);cursor:pointer;text-decoration:none;background:var(--branco);color:var(--marinho);box-shadow:inset 0 0 0 1px var(--borda);min-height:44px;transition:filter .12s,transform .08s}
.btn:hover{box-shadow:inset 0 0 0 1px var(--marinho)}
.btn:active{transform:scale(.97)}
.btn.prim{background:var(--laranja);color:var(--marinho);border-radius:9999px;padding:12px 22px;box-shadow:none;font-size:15px}
.btn.prim:hover{filter:brightness(.94)}
.btn.texto{background:none;box-shadow:none;min-height:0;padding:6px 4px;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.btn.perigo{color:var(--vermelho-texto)}
.btn.largo{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.botoes{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* calendário do mês */
.mes-cab{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mes-cab h2{text-align:center}
.seta{width:44px;height:44px;border-radius:50%;border:0;background:var(--trilho);color:var(--marinho);font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.seta[disabled]{opacity:.35;cursor:default}
.mes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.mes .sem{font-size:12px;font-weight:600;color:var(--legenda);padding:4px 0;text-transform:uppercase;letter-spacing:.06em}
.dia{aspect-ratio:1/1;width:100%;max-width:52px;justify-self:center;border:0;border-radius:50%;background:none;font:500 15px var(--sans);color:var(--legenda);cursor:default;position:relative}
.dia.tem{background:var(--trilho);color:var(--marinho);font-weight:600;cursor:pointer}
.dia.tem:hover{background:var(--ardosia)}
.dia.sel{background:var(--marinho);color:#fff}
.dia.hoje::after{content:'';position:absolute;left:50%;bottom:6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--laranja)}
.dia.vazio{visibility:hidden}

/* horários */
.dia-titulo{margin-top:20px;font:600 16px var(--display);color:var(--marinho);text-transform:none}
.periodo{margin-top:12px}
.periodo .rotulo{color:var(--legenda);margin-bottom:6px;display:block}
.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.hora{min-height:44px;border-radius:11px;border:1px solid var(--borda);background:var(--branco);color:var(--marinho);font:600 15px var(--sans);cursor:pointer}
.hora:hover{border-color:var(--marinho)}
.hora.sel{background:var(--marinho);color:#fff;border-color:var(--marinho)}
.fuso{margin-top:16px;font-size:13px;color:var(--legenda)}
.escolhas{border:0;padding:0;margin:0}
.escolhas legend{font-size:13.5px;font-weight:600;color:var(--marinho);margin-bottom:6px;padding:0}
.campo .escolhas label{display:flex;font-weight:500;gap:10px;align-items:center;border:1px solid var(--borda);border-radius:11px;padding:10px 12px;margin-top:6px;cursor:pointer;color:var(--marinho);font-size:15px}
.campo .escolhas label:has(input:checked){border-color:var(--marinho);box-shadow:inset 0 0 0 1px var(--marinho)}
.escolhas input{width:18px;height:18px;flex:0 0 18px;accent-color:var(--marinho)}
.campo.erro .escolhas label{border-color:var(--vermelho-texto)}
.escolhido + .pessoa{margin-top:14px}

/* formulário */
.campo{margin-top:14px}
.campo label{display:block;font-size:13.5px;font-weight:600;color:var(--marinho);margin-bottom:5px}
.campo .ajuda{font-size:12.5px;color:var(--legenda);margin-top:4px}
input[type=text],input[type=email],input[type=tel],select.caixa,textarea{width:100%;border:1px solid var(--borda);border-radius:11px;padding:11px 12px;background:var(--branco);color:var(--marinho);font-size:16px;min-height:46px}
textarea{min-height:84px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select.caixa:focus{border-color:var(--marinho);outline:none;box-shadow:0 0 0 3px rgba(250,122,53,.25)}
.campo.erro input,.campo.erro textarea{border-color:var(--vermelho-texto)}
.campo .msg-erro{font-size:12.5px;color:var(--vermelho-texto);margin-top:4px}
.aceite{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:13.5px;color:var(--marinho);cursor:pointer}
.aceite input{width:20px;height:20px;flex:0 0 20px;margin-top:1px;accent-color:var(--marinho)}
.escolhido{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--trilho);border-radius:12px;padding:12px 14px;color:var(--marinho)}
.escolhido b{font:600 15px var(--display);display:block}
.relogio{font-size:12.5px;color:var(--legenda);margin-top:8px}
.relogio.acabou{color:var(--atencao)}

/* avisos */
.aviso{border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.aviso.atencao{background:var(--pessego);color:var(--atencao)}
.aviso.ok{background:#E3F3E9;color:var(--verde-texto)}
.aviso b{display:block;margin-bottom:2px}

/* confirmação */
.selo{width:52px;height:52px;border-radius:50%;background:#E3F3E9;color:var(--verde-texto);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.selo.neutro{background:var(--areia);color:var(--legenda)}
.quando{font:600 22px/1.3 var(--display);color:var(--marinho);margin-top:12px;text-transform:none}
.quando small{display:block;font:500 15px var(--sans);color:var(--legenda);margin-top:2px}
.pessoa{display:flex;gap:14px;align-items:center;margin-top:18px}
.foto{width:56px;height:56px;flex:0 0 56px;border-radius:50%;background:var(--pessego);color:var(--laranja-texto);display:flex;align-items:center;justify-content:center;font:600 18px var(--display);overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}
.pessoa b{display:block;font:600 16px var(--display);color:var(--marinho)}
.pessoa small{display:block;font-size:13.5px;color:var(--legenda)}
.entrar{margin-top:18px;background:var(--trilho);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--marinho);overflow-wrap:anywhere}
.entrar a{font-weight:600}
.secao{margin-top:20px}
.secao > .rotulo{display:block;margin-bottom:8px}
.motivos{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.motivos label{display:flex;gap:10px;align-items:center;border:1px solid var(--borda);border-radius:11px;padding:11px 12px;cursor:pointer;color:var(--marinho);font-weight:500}
.motivos label:has(input:checked){border-color:var(--marinho);box-shadow:inset 0 0 0 1px var(--marinho)}
.motivos input{accent-color:var(--marinho);width:18px;height:18px}
.carregando{text-align:center;padding:40px 0;color:var(--legenda)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="equipe-faixa" id="faixaEquipe" hidden>Você está vendo a página como o cliente vê. Um agendamento feito aqui é de verdade.</div>
<div class="voltar-area" id="voltarArea" hidden><button class="btn texto" data-acao="voltar-area">‹ Voltar à sua área</button></div>
<header class="topo"><img src="marca/nord-liberta-positivo.svg" alt="Nord Liberta" width="94" height="30"></header>
<main id="main"><p class="carregando">Carregando…</p></main>
<footer>Nord Liberta · seus dados servem só para esta reunião.</footer>

<script id="motor-agenda">
// ===================== MOTOR DA AGENDA: as regras do agendamento, sem tela =====================
// Especificação: area-logada/AGENDAMENTO.md. Este bloco é a referência das regras que o desenvolvedor leva para a
// plataforma; as telas (agendamento.html, agendar.html e o encaixe em area-cliente.html) carregam a mesma cópia,
// passada pelo sync-motor.js, e o verificar-agenda.js o roda em Node.
// O estado é um objeto com uma coleção por documento do modelo de dados (agPessoas, agTipos…), cada uma indexada pelo
// id. As operações mudam o estado em memória e devolvem `escritas` (os documentos tocados), que a tela grava no
// armazém. Nada aqui tem tipo, pessoa, peso, duração ou lembrete: tudo vem do cadastro.
// O que está fora do navegador é simulado em pontos marcados "SIMULADO": o livre/ocupado e os eventos do calendário
// (na plataforma, Google e Microsoft) e o link da videoconferência.
// Datas e horas em UTC (ISO); durações e prazos em minutos; a grade e as exceções no fuso de cada pessoa.
const AGENDA = (() => {
  const MIN = 60000, DIA = 1440 * MIN;
  const BRASILIA = 'America/Sao_Paulo';   // o ciclo da distribuição conta em horário de Brasília; fuso de quem não informou
  const RESERVA_MIN = 5;                  // o horário escolhido fica reservado por 5 minutos
  const REMARCAR_DIAS = 7;                // remarcação: sem horário da mesma pessoa em 7 dias, oferece os do grupo
  const COLECOES = {
    pessoas: 'agPessoas', tipos: 'agTipos', remetentes: 'agRemetentes', agendamentos: 'agAgendamentos',
    liberacoes: 'agLiberacoes', links: 'agLinks', reservas: 'agReservas', mensagens: 'agMensagens',
    calendarios: 'agCalendarios', contatos: 'agContatos', saldos: 'agSaldos', config: 'agConfig',   // os quatro últimos só no protótipo (simulações)
    clientes: 'agClientes',   // simulação do login: quem é cada cliente (público, empresa, consultor); na plataforma, a sessão
  };
  const VALE = new Set(['marcado', 'realizado']);   // o que trava a agenda e entra na conta da distribuição
  const estadoVazio = () => { const e = {}; for (const k in COLECOES) e[k] = {}; return e; };

  // ---------- tempo e fuso ----------
  const ms = v => v == null || v === '' ? NaN : typeof v === 'number' ? v : Date.parse(v);
  const iso = t => new Date(t).toISOString();
  const pad = n => String(n).padStart(2, '0');
  const hm = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };
  const fmts = {};
  const fmt = (tz, chave, o) => fmts[chave + tz] || (fmts[chave + tz] = new Intl.DateTimeFormat(chave === 'p' ? 'en-US' : 'pt-BR', Object.assign({ timeZone: tz }, o)));
  const DOW = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  function partes(t, tz) {
    const o = {};
    for (const p of fmt(tz, 'p', { hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short' }).formatToParts(new Date(t))) o[p.type] = p.value;
    return { a: +o.year, m: +o.month, d: +o.day, h: +o.hour % 24, mi: +o.minute, s: +o.second, dow: DOW[o.weekday] };
  }
  const deslocamento = (t, tz) => { const p = partes(t, tz); return (Date.UTC(p.a, p.m - 1, p.d, p.h, p.mi, p.s) - Math.floor(t / 1000) * 1000) / MIN; };
  // a hora local (dia + minutos desde a meia-noite) num fuso → o instante UTC
  function deLocal(a, m, d, minutos, tz) {
    const g = Date.UTC(a, m - 1, d) + minutos * MIN;
    const t = g - deslocamento(g, tz) * MIN;
    return g - deslocamento(t, tz) * MIN;
  }
  const dataLocal = (t, tz) => { const p = partes(ms(t), tz); return p.a + '-' + pad(p.m) + '-' + pad(p.d); };
  const formatarData = (t, tz) => fmt(tz || BRASILIA, 'd', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(ms(t)));
  const formatarHora = (t, tz) => fmt(tz || BRASILIA, 'h', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(ms(t)));
  function diasEntre(ini, fim, tz) {
    const a = partes(ini, tz), b = partes(fim, tz), r = [];
    for (let t = Date.UTC(a.a, a.m - 1, a.d), tf = Date.UTC(b.a, b.m - 1, b.d); t <= tf; t += DIA) {
      const d = new Date(t);
      r.push({ a: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), dow: d.getUTCDay(), chave: d.toISOString().slice(0, 10), semana: new Date(t - ((d.getUTCDay() + 6) % 7) * DIA).toISOString().slice(0, 10) });
    }
    return r;
  }
  const somaMeses = (t, n) => { const d = new Date(t); d.setUTCMonth(d.getUTCMonth() + n); return d.getTime(); };
  function inicioDoCiclo(ciclo, agora) {
    if (ciclo === 'continuo') return -Infinity;
    const p = partes(agora, BRASILIA);
    const m = ciclo === 'trimestre' ? Math.floor((p.m - 1) / 3) * 3 + 1 : p.m;
    return deLocal(p.a, m, 1, 0, BRASILIA);
  }

  // ---------- ids e sorteio ----------
  const LETRAS = 'abcdefghjkmnpqrstuvwxyz23456789';
  const novoId = (rng, n) => { let s = ''; for (let i = 0; i < (n || 10); i++) s += LETRAS[Math.floor((rng || Math.random)() * LETRAS.length)]; return s; };
  const copia = v => v == null ? v : JSON.parse(JSON.stringify(v));
  function novaTx(estado) {
    const toc = new Map();
    return {
      put(col, doc) { estado[col][doc.id] = doc; toc.set(col + '/' + doc.id, { col, id: doc.id }); return doc; },
      del(col, id) { delete estado[col][id]; toc.set(col + '/' + id, { col, id, apagado: true }); },
      get escritas() { return [...toc.values()]; },
    };
  }

  // ---------- pessoas ----------
  // ok | inativo | sem_calendario | quebrado. Quem tem um calendário conferido com a conexão quebrada sai dos grupos.
  function situacaoPessoa(estado, pid) {
    const p = estado.pessoas[pid];
    if (!p || p.ativo === false) return 'inativo';
    const cal = p.calendarios || [];
    if (cal.some(c => c.estado === 'quebrado' && c.confere !== false)) return 'quebrado';
    if (!cal.some(c => c.estado === 'conectado')) return 'sem_calendario';
    return 'ok';
  }
  const elegivel = (estado, pid) => situacaoPessoa(estado, pid) === 'ok';
  // quem pode atender este pedido: o consultor do cliente, uma pessoa só (remarcação) ou as habilitadas e participando
  function candidatos(estado, tipo, op) {
    if (op && op.soPessoa) return elegivel(estado, op.soPessoa) ? [op.soPessoa] : [];
    if (tipo.atende === 'consultorDoCliente') return op && op.consultor && elegivel(estado, op.consultor) ? [op.consultor] : [];
    return (tipo.pessoas || []).filter(x => x.participando !== false && elegivel(estado, x.pessoa)).map(x => x.pessoa);
  }

  // ---------- livre e ocupado ----------
  // SIMULADO: os compromissos de fora vêm de agCalendarios/<pessoa>.ocupados; na plataforma, do livre/ocupado do
  // Google e do Microsoft, de todos os calendários com "confere". As reuniões da ferramenta travam com os intervalos.
  function ocupacoes(estado, pid, ignorar) {
    const r = ((estado.calendarios[pid] || {}).ocupados || []).map(o => { const i = ms(o.inicio), f = ms(o.fim); return { i, f, ib: i, fb: f }; });
    for (const a of Object.values(estado.agendamentos)) {
      if (a.id === ignorar || !VALE.has(a.estado) || (a.atende !== pid && !(a.adicionais || []).includes(pid))) continue;
      const g = a.regras || {}, i = ms(a.inicio), f = ms(a.fim);

<script id="armazem-agenda">
// ===================== ARMAZÉM DA AGENDA: onde os documentos do agendamento ficam =====================
// Um documento por registro, como no modelo de dados (agPessoas/<id>, agTipos/<id>…), cada um gravado como
// { dados, em }. O estado em memória é o mesmo objeto que o motor usa (AGENDA.estadoVazio()), e as telas o leem direto.
//   nuvem  no link publicado, o banco do próprio link (claude.use('db')), ouvido coleção a coleção;
//   local  em localhost, o armazenamento do navegador (nl-db:<coleção>/<id>); as abas deste navegador se avisam.
// Na plataforma, este bloco inteiro é trocado pelas tabelas e pela API, com a mesma interface
// (iniciar, estado, gravar, ouvir, apagarTudo, relogio).
const ARMAZEM_AGENDA = (() => {
  const COL = AGENDA.COLECOES, DE_NOME = {};
  for (const k in COL) DE_NOME[COL[k]] = k;
  const estado = AGENDA.estadoVazio(), ouvintes = [];
  let db = null, info = null;
  const chave = (col, id) => 'nl-db:' + COL[col] + '/' + id;
  const avisa = () => ouvintes.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  const ler = (col, id, txt) => { try { const v = JSON.parse(txt); if (v && v.dados) estado[col][id] = v.dados; else delete estado[col][id]; } catch (e) { delete estado[col][id]; } };

    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i), m = k && k.match(/^nl-db:(ag[A-Za-z]+)\/(.+)$/);
        if (m && DE_NOME[m[1]]) ler(DE_NOME[m[1]], m[2], localStorage.getItem(k));
      }
    } catch (e) { }
  }
  function iniciar() {
    if (info) return info;
    info = (async () => {
      const c = typeof window !== 'undefined' && window.claude && window.claude.use ? window.claude : null;
      if (c) {
        try { db = await Promise.race([c.use('db'), new Promise(r => setTimeout(() => r(null), 8000))]); } catch (e) { db = null; }
        if (db) {
          await Promise.all(Object.keys(COL).map(col => new Promise(pronto => {
            let primeiro = true; const fim = () => { if (primeiro) { primeiro = false; pronto(); } };
            db.collection(COL[col]).onSnapshot(snap => {
              const novo = {};
              snap.docs.forEach(d => { const v = d.data(); if (v && v.dados) novo[d.id] = v.dados; });
              for (const id in estado[col]) if (!(id in novo)) delete estado[col][id];
              Object.assign(estado[col], novo);

            }, fim);
            setTimeout(fim, 8000);
          })));

        }

        const m = e.key && e.key.match(/^nl-db:(ag[A-Za-z]+)\/(.+)$/); if (!m || !DE_NOME[m[1]]) return;
        if (e.newValue == null) delete estado[DE_NOME[m[1]]][m[2]]; else ler(DE_NOME[m[1]], m[2], e.newValue);
        avisa();
      });
      return { modo: 'local' };
    })();
    return info;
  }
  // grava os documentos tocados (as `escritas` do motor, ou { col, id } de uma edição do painel)
  async function gravar(escritas) {
    const em = new Date().toISOString();
    for (const w of escritas || []) {
      const doc = w.apagado ? null : estado[w.col][w.id];
      if (!db) { try { if (doc == null) localStorage.removeItem(chave(w.col, w.id)); else localStorage.setItem(chave(w.col, w.id), JSON.stringify({ dados: doc, em })); } catch (e) { } continue; }
      const ref = db.doc(COL[w.col] + '/' + w.id);
      if (doc == null) await ref.delete(); else await ref.set({ dados: JSON.parse(JSON.stringify(doc)), em });
    }
  }
  async function apagarTudo() {
    const escritas = [];
    for (const col in COL) for (const id of Object.keys(estado[col])) { delete estado[col][id]; escritas.push({ col, id, apagado: true }); }
    await gravar(escritas);
  }

  // "Avançar o tempo", no painel, guarda o deslocamento em agConfig/relogio, e as duas telas leem o mesmo relógio.
  const relogio = (() => {
    const q = typeof location !== 'undefined' ? new URLSearchParams(location.search).get('hoje') : null;
    const base = q ? Date.parse(q.length <= 16 ? q + ':00-03:00' : q) : NaN, t0 = Date.now();
    const desloca = () => Number((estado.config.relogio || {}).deslocamento) || 0;
    return { agora: () => (isNaN(base) ? Date.now() : base + (Date.now() - t0)) + desloca(), get deslocamento() { return desloca(); }, fixado: !isNaN(base) };
  })();
  return { iniciar, estado, gravar, apagarTudo, ouvir: f => ouvintes.push(f), relogio, get nuvem() { return !!db; } };
})();
</script>

  const iniciais = (p.nome || '?').split(/\s+/).slice(0, 2).map(x => x[0]).join('').toUpperCase();
  return `<div class="pessoa"><span class="foto">${p.foto ? `<img src="${esc(p.foto)}" alt="">` : esc(iniciais)}</span><div><b>${esc(titulo)} ${esc(p.nome)}</b>${p.bio ? `<small>${esc(p.bio)}</small>` : ''}</div></div>${p.descricao ? `<p class="nota" style="margin-top:8px">${esc(p.descricao)}</p>` : ''}`;
}
// uma pergunta do formulário, no tipo de resposta que o admin escolheu
function campoPergunta(p, i) {
  const v = S.form.respostas[p.rotulo], er = S.erros['r:' + p.rotulo], id = 'q' + i, tp = p.tipo || 'longo', ops = (p.opcoes || []).filter(Boolean);
  const rot = esc(p.rotulo) + (p.obrigatorio ? '' : ' <span class="nota">(opcional)</span>'), dp = `data-pergunta="${esc(p.rotulo)}"`;
  let ctl;
  if (tp === 'unica' || tp === 'multipla') {
    const lista = tp === 'multipla' ? [].concat(v || []) : [v];
    ctl = `<fieldset class="escolhas"><legend>${rot}</legend>${ops.map((o, k) => `<label><input type="${tp === 'unica' ? 'radio' : 'checkbox'}" name="${id}" value="${esc(o)}" ${dp} data-tipo="${tp}"${lista.includes(o) ? ' checked' : ''}${k === 0 ? ` id="${id}"` : ''}>${esc(o)}</label>`).join('')}</fieldset>`;
    return `<div class="campo${er ? ' erro' : ''}">${ctl}${er ? `<div class="msg-erro">${esc(er)}</div>` : ''}</div>`;
  }
  if (tp === 'lista') ctl = `<select class="caixa" id="${id}" ${dp}><option value="">Escolha</option>${ops.map(o => `<option${v === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  else if (tp === 'curto') ctl = `<input type="text" id="${id}" ${dp} value="${esc(v || '')}">`;
  else if (tp === 'data') ctl = `<input type="date" id="${id}" ${dp} value="${esc(v || '')}">`;
  else ctl = `<textarea id="${id}" ${dp}>${esc(v || '')}</textarea>`;
  return `<div class="campo${er ? ' erro' : ''}"><label for="${id}">${rot}</label>${ctl}${er ? `<div class="msg-erro">${esc(er)}</div>` : ''}</div>`;
}

async function escolherHorario(inicio) {
  if (S.etapa === 'remarcar') { S.inicio = inicio; S.etapa = 'confirmarRemarcar'; desenhar(); scrollTo(0, 0); return; }
  if (S.reserva) { await gravar(A.soltar(E, S.reserva)); S.reserva = null; }
  const r = A.reservar(E, S.tipo, inicio, { agora: agora(), consultor: S.quem.consultor });
  if (!r.ok) { S.proximos = A.proximos(E, S.tipo, inicio, { agora: agora(), consultor: S.quem.consultor }); desenhar(); return; }
  await gravar(r);
  Object.assign(S, { inicio, reserva: r.reserva, pessoa: r.pessoa, expira: Date.parse(r.expiraEm), etapa: 'dados', proximos: null, dia: A.dataLocal(inicio, S.tz) });
  desenhar(); scrollTo(0, 0);
  const n = $('#nome'); if (n && !n.value && matchMedia('(min-width:860px)').matches) n.focus();
}
// as respostas sem os campos em branco (as de várias escolhas são listas)
function respostasLimpas() { const r = {}; for (const [k, v] of Object.entries(S.form.respostas)) { const x = Array.isArray(v) ? v.slice() : String(v).trim(); if (A.respondida(x)) r[k] = x; } return r; }
function validar() {
  const f = S.form, er = {}, d = digitos(f.whatsapp);
  if (S.cadastro) { for (const [rot, msg] of Object.entries(A.validarRespostas(tipo().formulario, respostasLimpas()))) er['r:' + rot] = msg; S.erros = er; return !Object.keys(er).length; }
  if (!f.nome.trim()) er.nome = 'Diga o seu nome.';
  if (d.length < 10 || d.length > 13) er.whatsapp = 'Escreva o WhatsApp com o DDD.';
  if (!/^\S+@\S+\.\S+$/.test(f.email.trim())) er.email = 'Confira o e-mail.';
  for (const [rot, msg] of Object.entries(A.validarRespostas(tipo().formulario, respostasLimpas()))) er['r:' + rot] = msg;
  S.erros = er; return !Object.keys(er).length;
}
async function confirmarAgendamento() {
  if (S.ocupado) return;
  if (!validar()) { desenhar(); const pr = document.querySelector('.campo.erro input,.campo.erro textarea,.campo.erro select'); if (pr) pr.focus(); return; }
  S.ocupado = true; desenhar();
  const f = S.form, respostas = respostasLimpas();
  const r = A.confirmar(E, {
    tipo: S.tipo, inicio: S.inicio, origem: S.origem, quem: S.quem, reserva: S.reserva, chave: S.chave, fusoCliente: BR, por: Q.get('por') || undefined,
    link: S.link && S.link.id, code: S.link && S.link.code,
    cliente: S.cadastro ? { respostas } : { nome: f.nome.trim(), whatsapp: formataZap(f.whatsapp), email: f.email.trim(), respostas, aceite: f.aceite },
  }, { agora: agora(), base: BASE });
  S.ocupado = false;
  if (r.ok) {
    await gravar(r);
    S.ag = r.agendamento; S.reserva = null; S.etapa = 'feito'; S.titulo = '';
    history.replaceState(null, '', 'agendar.html?ag=' + encodeURIComponent(S.ag.id) + '&code=' + encodeURIComponent(S.ag.codigo) + (DA_EQUIPE ? '&ver=equipe' : '') + (AREA ? '&area=' + encodeURIComponent(AREA) : ''));
  } else if (r.motivo === 'respostas') {
    for (const [rot, msg] of Object.entries(r.erros)) S.erros['r:' + rot] = msg;
  } else if (r.motivo === 'tomado') {
    S.reserva = null; S.pessoa = null; S.proximos = r.proximos; S.inicio = null; S.etapa = 'escolher';
    if (r.proximos[0]) { S.mes = mesDe(Date.parse(r.proximos[0].inicio)); S.dia = A.dataLocal(r.proximos[0].inicio, S.tz); }
  } else if (r.motivo === 'ja_marcado') {
    if (S.reserva) { await gravar(A.soltar(E, S.reserva)); S.reserva = null; }
    const ag = r.agendamento;
    S.aviso = { titulo: 'Você já tem esta conversa marcada', texto: 'Está marcada para ' + esc(data(ag.inicio)) + ', às ' + esc(hora(ag.inicio)) + '. Se precisar, dá para remarcar ou cancelar por lá.',
      acoes: `<div class="botoes" style="justify-content:center;margin-top:16px"><a class="btn prim" href="agendar.html?ag=${encodeURIComponent(ag.id)}&code=${encodeURIComponent(ag.codigo)}">Ver a minha reunião</a></div>` };
    S.etapa = 'aviso';
  } else {
    S.aviso = { titulo: 'Não foi possível agendar', texto: MOTIVO_NAO[r.motivo] ? MOTIVO_NAO[r.motivo](r) : 'Tente de novo em instantes.' };
    S.etapa = 'aviso';
  }
  desenhar(); scrollTo(0, 0);
}
async function remarcarAgora() {
  if (S.ocupado) return; S.ocupado = true; desenhar();

  S.ocupado = false;
  if (r.ok) {
    await gravar(r); S.ag = r.agendamento; S.etapa = 'feito'; S.titulo = 'remarcada';
    history.replaceState(null, '', 'agendar.html?ag=' + encodeURIComponent(S.ag.id) + '&code=' + encodeURIComponent(S.ag.codigo) + (DA_EQUIPE ? '&ver=equipe' : ''));
  } else if (r.motivo === 'tomado') { S.etapa = 'remarcar'; S.proximos = A.proximos(E, S.ag.tipo, S.inicio, { agora: agora(), ignorar: S.ag.id, soPessoa: S.doGrupo ? undefined : S.ag.atende }); }
  else if (r.motivo === 'fora_do_prazo') { S.etapa = 'gerir'; }
  else { S.aviso = { titulo: 'Não foi possível remarcar', texto: 'Esta reunião não pode mais ser remarcada por aqui.' }; S.etapa = 'aviso'; }

}
async function cancelarAgora() {
  const obrig = (S.ag.regras || {}).motivoObrigatorio, outro = S.motivo === 'Outro motivo';
  const motivo = outro ? S.motivoOutro.trim() : S.motivo;
  if (obrig && !motivo) { S.erros = { motivo: outro ? 'Conte o motivo em poucas palavras.' : 'Escolha um motivo.' }; desenhar(); return; }
  S.erros = {}; S.ocupado = true; desenhar();
  const r = A.cancelar(E, S.ag.id, { agora: agora(), quem: 'cliente', motivo: outro ? 'Outro: ' + motivo : motivo, base: BASE });
  S.ocupado = false;
  if (r.ok) { await gravar(r); S.ag = r.agendamento; }
  S.etapa = 'gerir'; desenhar(); scrollTo(0, 0);
}
function baixarIcs() {
  const blob = new Blob([A.ics(E, S.ag, { base: BASE })], { type: 'text/calendar;charset=utf-8' }), url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = 'reuniao-nord.ics'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function irPara(etapa) {
  S.proximos = null; S.erros = {};
  if (etapa === 'escolher') { S.etapa = 'escolher'; }
  else if (etapa === 'remarcar') {
    S.doGrupo = A.horariosParaRemarcar(E, S.ag.id, { agora: agora() }).doGrupo; S.etapa = 'remarcar';
    if (!abrirNoPrimeiro()) S.mes = mesDe(agora());
  }
  else S.etapa = etapa;
  desenhar(); scrollTo(0, 0);
}

  const d = e.target.closest('[data-dia]'); if (d) { S.dia = d.dataset.dia; desenhar(); const t = document.querySelector('.dia-titulo'); if (t && !matchMedia('(min-width:860px)').matches) t.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); return; }
  const h = e.target.closest('[data-inicio]'); if (h) { escolherHorario(h.dataset.inicio); return; }
  const m = e.target.closest('[data-mes]'); if (m && !m.disabled) { S.mes = somaMes(S.mes, +m.dataset.mes); const hs = doMes(S.mes); S.dia = hs.length ? A.dataLocal(hs[0].inicio, S.tz) : null; desenhar(); return; }
  const ir = e.target.closest('[data-ir]'); if (ir) { irPara(ir.dataset.ir); return; }
  const a = e.target.closest('[data-acao]'); if (!a) return;
  if (a.dataset.acao === 'ics') baixarIcs();
  if (a.dataset.acao === 'voltar-area') voltarArea();
  if (a.dataset.acao === 'remarcar') remarcarAgora();
});
// tira o aviso de erro de um campo assim que a pessoa mexe nele
function limpaErro(el, chave) { if (!S.erros[chave]) return; delete S.erros[chave]; const c = el.closest('.campo'); if (!c) return; c.classList.remove('erro'); const m = c.querySelector('.msg-erro'); if (m) m.remove(); }
document.addEventListener('input', e => {
  const el = e.target, f = S.form;
  if (['nome', 'whatsapp', 'email'].includes(el.id)) { f[el.id] = el.value; if (S.erros[el.id]) { delete S.erros[el.id]; const c = el.closest('.campo'); c.classList.remove('erro'); const m = c.querySelector('.msg-erro'); if (m) m.remove(); } }
  else if (el.dataset.pergunta && !el.dataset.tipo) { f.respostas[el.dataset.pergunta] = el.value; limpaErro(el, 'r:' + el.dataset.pergunta); }
  else if (el.id === 'motivoOutro') S.motivoOutro = el.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'aceite') S.form.aceite = el.checked;
  else if (el.id === 'whatsapp') { el.value = formataZap(el.value); S.form.whatsapp = el.value; }
  else if (el.dataset.tipo) {
    const rot = el.dataset.pergunta;
    S.form.respostas[rot] = el.dataset.tipo === 'unica' ? el.value : [...document.querySelectorAll('input[data-pergunta="' + CSS.escape(rot) + '"]:checked')].map(x => x.value);
    limpaErro(el, 'r:' + rot);
  }
  else if (el.dataset.pergunta && el.tagName === 'SELECT') { S.form.respostas[el.dataset.pergunta] = el.value; limpaErro(el, 'r:' + el.dataset.pergunta); }
  else if (el.name === 'motivo') { S.motivo = el.value; $('#campoOutro').hidden = el.value !== 'Outro motivo'; if (el.value === 'Outro motivo') $('#motivoOutro').focus(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'formDados') confirmarAgendamento();
  if (e.target.id === 'formCancelar') cancelarAgora();
});
// quem desiste devolve o horário: a reserva sai ao fechar a página
addEventListener('pagehide', () => { if (S.reserva && E.reservas[S.reserva]) { const r = A.soltar(E, S.reserva); S.reserva = null; AR.gravar(r.escritas); } });
// outra aba (o painel) mudou algo: redesenha quando não há ninguém digitando
AR.ouvir(() => {
  if (S.ag && E.agendamentos[S.ag.id]) S.ag = E.agendamentos[S.ag.id];
  const a = document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  if (['escolher', 'remarcar', 'gerir'].includes(S.etapa)) desenhar();
});

// ===================== ABRIR =====================
async function abrir() {
  await AR.iniciar();
  if (DA_EQUIPE) $('#faixaEquipe').hidden = false;
  const t = Q.get('t'), agId = Q.get('ag'), code = Q.get('code');
  if (agId) {
    const ag = E.agendamentos[agId];
    if (!ag || ag.codigo !== code) { S.aviso = { titulo: 'Link inválido', texto: 'Não encontramos esta reunião. Confira o link que chegou na mensagem.' }; S.etapa = 'aviso'; return desenhar(); }
    S.ag = ag; document.title = (ag.regras.nomePublico || 'Reunião') + ' · Nord';
    S.etapa = 'gerir'; desenhar();
    const acao = Q.get('acao');
    if (ag.estado === 'marcado' && acao === 'remarcar' && A.podeMudar(ag, 'remarcar', agora())) irPara('remarcar');
    else if (ag.estado === 'marcado' && acao === 'cancelar' && A.podeMudar(ag, 'cancelar', agora())) irPara('cancelar');
    return;
  }
  if (AREA) $('#voltarArea').hidden = false;
  // quem já é conhecido: o link pessoal, a área logada ou o consultor
  const aviso = (titulo, texto) => { S.aviso = { titulo, texto }; S.etapa = 'aviso'; desenhar(); };
  let tipoId = null;
  if (Q.get('id')) {
    const v = A.validarLink(E, Q.get('id'), Q.get('code'), agora());
    if (!v.ok) {
      const ag = v.agendamento && E.agendamentos[v.agendamento];
      S.aviso = { titulo: 'Este link não vale mais', texto: MOTIVO_NAO[v.motivo] ? MOTIVO_NAO[v.motivo](v) : '', acoes: ag ? `<div class="botoes" style="justify-content:center;margin-top:16px"><a class="btn prim" href="agendar.html?ag=${encodeURIComponent(ag.id)}&code=${encodeURIComponent(ag.codigo)}">Ver a reunião marcada</a></div>` : '' };
      S.etapa = 'aviso'; return desenhar();
    }
    S.link = v.link; S.origem = 'pessoal'; tipoId = v.link.tipo; S.quem = Object.assign({}, v.link.quem); S.cadastro = Object.assign({ id: S.quem.id }, v.link.cliente);
  } else if (Q.get('interno') || Q.get('pelo')) {
    const cid = Q.get('cliente') || Q.get('pelo'), quem = A.quemDoCliente(E, cid);
    if (!quem) return aviso('Não encontramos o seu cadastro', 'Entre de novo na sua área.');
    S.quem = quem; S.origem = Q.get('pelo') ? 'consultor' : 'interno'; tipoId = Q.get('interno') || Q.get('tipo'); S.cadastro = Object.assign({}, E.clientes[cid]);
  }
  if (tipoId) {
    S.tipo = tipoId; const tp = tipo();
    if (!tp) return aviso('Reunião não encontrada', 'Esta reunião não existe mais.');
    document.title = (tp.nomePublico || 'Agendar') + ' · Nord';
    const pa = A.podeAgendar(E, S.tipo, S.quem, { origem: S.origem, agora: agora() });
    if (!pa.pode) return aviso(tp.nomePublico, MOTIVO_NAO[pa.motivo] ? MOTIVO_NAO[pa.motivo](pa) : 'Não dá para agendar agora.');
    if (!abrirNoPrimeiro()) return aviso(tp.nomePublico, 'Não há horários livres nos próximos dias. Fale com quem te atende.');
    S.etapa = 'escolher'; return desenhar();
  }
  const achado = t && A.resolverEndereco(E, t);
  if (!achado) { S.aviso = { titulo: 'Link não encontrado', texto: 'Confira o link que você recebeu, ou fale com quem o enviou.' }; S.etapa = 'aviso'; return desenhar(); }
  S.tipo = achado.tipo; document.title = (tipo().nomePublico || 'Agendar') + ' · Nord';
  if (!achado.ligado) { S.aviso = { titulo: tipo().nomePublico || 'Agendamentos fechados', texto: 'Os agendamentos por este link estão fechados no momento. Fale com quem te enviou o link.' }; S.etapa = 'aviso'; return desenhar(); }
  // conta a abertura (uma por visita; a prévia da equipe não conta)
  if (!DA_EQUIPE) {
    let visto = false; try { visto = sessionStorage.getItem('nl-ag-aberto:' + S.tipo) === '1'; sessionStorage.setItem('nl-ag-aberto:' + S.tipo, '1'); } catch (e) { }
    if (!visto) { const tp = tipo(); tp.aberturas = (Number(tp.aberturas) || 0) + 1; AR.gravar([{ col: 'tipos', id: tp.id }]); }
  }
  if (!abrirNoPrimeiro()) { S.aviso = { titulo: tipo().nomePublico, texto: 'Não há horários livres nos próximos dias. Fale com quem te enviou o link para combinar outro momento.' }; S.etapa = 'aviso'; return desenhar(); }
  S.etapa = 'escolher'; desenhar();
}
abrir().catch(err => { console.error(err); $('#main').innerHTML = '<div class="cartao">Não conseguimos abrir a página. Recarregue, por favor.</div>'; });
</script>
