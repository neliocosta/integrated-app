<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendamento · Nord Liberta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Sora:wght@500;600&display=swap" rel="stylesheet">
<!--
  O painel interno do agendamento de reuniões (a especificação está em area-logada/AGENDAMENTO.md): Equipe, Links de
  agendamento, Minha agenda e o calendário simulado. Mensagens completas, caixa de saída e relógio (passo 4), pessoas e
  pesos com cota × realizado (passo 5) e públicos, liberação e link pessoal (passo 6) entram depois.

  Decisões tomadas na construção (também em AGENDAMENTO.md › "Decidido na construção do protótipo"):
  Motor
  - Remarcar cria um agendamento novo (remarcadoDe = o antigo) e o antigo fica "remarcado". O novo herda o feitoEm do
    antigo, para a reunião contar uma vez só no ciclo em que foi feita.
  - Reatribuir troca quem atende no mesmo agendamento e guarda quem perdeu em reatribuidoDe[].
  - "Depois da reunião" conta a partir do fim; "antes", a partir do início.
  - Os intervalos não se somam: a reunião nova (com os intervalos dela) não pode bater na reunião existente, e a
    reunião nova não pode bater nos intervalos da existente. Compromissos de fora do agendamento não têm intervalo.
  - O participante adicional só precisa estar livre no calendário (com os intervalos do tipo); a grade e os limites
    são de quem atende. Adicional com a conexão quebrada tira todos os horários do tipo.
  - A grade própria do tipo, quando existe, é cruzada com a de cada pessoa, no fuso da pessoa.
  - Quem entra no meio do ciclo (ou volta a participar) ganha um crédito que o põe exatamente na cota naquele
    instante: c = peso × agendamentos do ciclo até ali / (1 − peso).
  - Palavras e valores de faixa no nome público, na descrição, no endereço ou num modelo que vai ao cliente impedem
    ligar o tipo (não é só aviso). Variável "só da equipe" ligada a uma mensagem do cliente sai em branco e também
    impede ligar.
  - O endereço público só abre tipos de quem ainda não é cliente; os outros públicos agendam pela área logada ou
    por link pessoal.
  - O consultor que agenda pelo cliente dispensa a liberação (o gesto dele é a liberação).
  - Cancelar pela equipe sempre devolve os tokens; pelo cliente, só no prazo e com o interruptor ligado.
  - A liberação a cada N meses conta da última liberação daquele cliente para aquele tipo; a primeira é à mão.
  - O e-mail de confirmação (com o convite .ics) sai sempre que houver e-mail, mesmo com o WhatsApp.
  Painel
  - O armazém da agenda é um bloco próprio (o script "armazem-agenda"), um documento por registro, como no modelo
    de dados. No link publicado, fala com o banco do próprio link; em localhost, com o navegador (nl-db:<coleção>/<id>),
    e as abas abertas se avisam. A ponte com a página Clientes (o painel aberto num quadro) entra com o encaixe do
    passo 6, porque a ponte de hoje só ouve documentos soltos, e o painel ouve coleções.
  - "Entrar como" fica neste navegador (nl-ag-eu); a primeira pessoa cadastrada é admin e já entra.
  - Grade e exceções entram já aqui ("Minha agenda"): sem elas não há horário livre para mostrar.
  - ?hoje=AAAA-MM-DDTHH:MM é horário de Brasília, e o relógio anda a partir dali.
  - Antecedência, prazos de cancelar e de remarcar são escritos em minutos, horas ou dias e guardados em minutos.
  - O convite da pessoa nova vai para a fila de mensagens (agMensagens, evento "convite"), para a caixa de saída do
    passo 4 mostrar. "Simular: aceitar o convite" faz o papel do primeiro login.
  - Conectar um calendário conta como ter entrado (aceita o convite).
  - Um tipo ligado que deixa de cumprir o essencial (por uma edição) desliga sozinho, com aviso.
  Mensagens (passo 4)
  - Modelo pausado ou rejeitado na Meta não desliga o tipo: vira aviso (AGENDA.avisos), o cliente recebe por e-mail e
    os admins são avisados. Um lembrete incompleto também é só aviso, e não sai.
  - "Parar" interrompe os lembretes do cliente; os de quem atende seguem.
  - Cada variável de um modelo é um dado do agendamento, um texto fixo ({ texto }) ou um campo escrito a cada reunião
    ({ porReuniao: rótulo }); a mensagem com o campo em branco espera (aguardando) e sai quando o consultor escreve.
  - As mensagens de depois saem também com a reunião "realizada".
  - O número de WhatsApp e os modelos são desejáveis, não obrigatórios: sem eles, as mensagens saem por e-mail, com
    o texto padrão (avisos no tipo, não pendências).
  Públicos e encaixe (passo 6)
  - agClientes simula o login (público, empresa, consultor), com os ids dos exemplos da área do cliente.
  - O aprofundamento é liberado pelo consultor na página da reunião; o check-up, 12 meses depois da clínica realizada
    (liberaAposTipo e liberaAposMeses no tipo).
  - Logado, pelo link pessoal ou pelo consultor: sem formulário, com os dados e o aceite do cadastro.
  Pessoas e pesos (passo 5)
  - Ao mudar um peso, a diferença sai de quem está abaixo na lista (preencher de cima para baixo dá 60, 25 e 15).
  - A cota × realizado e a simulação ficam no bloco Pessoas e pesos; a simulação não grava nada.
  - Agendamentos: antes do início, remarcar, cancelar e passar para outra pessoa (admin); depois, realizada e não
    compareceu. Reatribuir para quem tem compromisso no horário só forçando.
  - O relógio simulado guarda o deslocamento em agConfig/relogio; o painel faz o papel do agendador de tarefas (ao abrir,
    a cada 20 segundos e ao avançar o tempo).
-->
<style>
:root{
  --laranja:#FA7A35; --laranja-texto:#E06600; --pessego:#FFF3EB; --marinho:#20344C; --marinho-noite:#131F2E;
  --creme:#FDFCFA; --branco:#FFFFFF; --grafite:#555555; --legenda:#6B6A66; --areia:#F1EEE8; --borda:#DDDDDD;
  --ardosia:#DCE3EC; --verde-texto:#22794A; --vermelho-texto:#B53434; --atencao:#964400; --trilho:#EEF1F5;
  --aurora:#F6A06B; --liberado:#FCD9C2;
  --sombra:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  --sombra-alta:0 4px 10px rgba(0,0,0,.08),0 12px 28px rgba(0,0,0,.10);
  --sombra-flut:0 20px 50px rgba(0,0,0,.25);
  --sans:'DM Sans',system-ui,sans-serif; --display:'Sora',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--creme);color:var(--grafite);font:400 15px/1.6 var(--sans);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--marinho)}
:focus-visible{outline:2px solid var(--laranja);outline-offset:2px}
[hidden]{display:none!important}

/* cabeçalho */
.barra{background:var(--marinho);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 24px;position:sticky;top:0;z-index:20}
.barra img{width:28px;height:28px;flex:0 0 28px}
.barra .marca b{font:600 15px var(--display);display:block;line-height:1.2}
.barra .marca span{font-size:12px;color:rgba(255,255,255,.7);line-height:1.2;display:block}
.barra .eu{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.barra .eu label{color:rgba(255,255,255,.75);white-space:nowrap}
.barra .eu select{background:var(--marinho-noite);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:11px;padding:6px 10px;max-width:220px}
.barra .salvo{font-size:12px;color:rgba(255,255,255,.7);min-width:54px;text-align:right}
.relogio-barra{background:var(--laranja);color:var(--marinho);border-radius:9999px;padding:3px 10px;font:600 12px var(--sans);text-decoration:none;white-space:nowrap}

/* cota × realizado */
.cotas{display:flex;flex-direction:column;gap:2px}
.cota{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 120px;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--areia)}
.cota:first-child{border-top:0}
.cota.fora{opacity:.6}
.cota .quem{display:flex;gap:10px;align-items:center;min-width:0}
.cota .quem b{display:block;font-weight:600;color:var(--marinho);line-height:1.3}
.cota .quem small{display:block;font-size:12.5px;color:var(--legenda)}
.trilho-cota{position:relative;height:14px;background:var(--trilho);border-radius:9999px}
.trilho-cota .real{position:absolute;left:0;top:0;bottom:0;background:var(--marinho);border-radius:9999px;min-width:2px}
.trilho-cota .marca{position:absolute;top:-5px;bottom:-5px;border-left:2px dashed var(--marinho);margin-left:-1px}
.cota .valor b{display:block;font:600 18px var(--display);color:var(--marinho);line-height:1.2}
.cota .valor small{display:block;font-size:12px;color:var(--legenda)}
.cota .conta{grid-column:2/-1;font-size:12.5px;color:var(--legenda)}
@media (max-width:600px){.cota{grid-template-columns:minmax(0,1fr) 100px}.trilho-cota{grid-column:1/-1;grid-row:2}.cota .conta{grid-column:1/-1}}

/* agendamentos */
.ag-item{text-decoration:none;color:inherit}
.ag-item:hover .corpo b{text-decoration:underline}
.ag-data{flex:0 0 64px;text-align:center;background:var(--trilho);border-radius:12px;padding:8px 4px;color:var(--marinho);line-height:1.25}
.ag-data b{display:block;font:600 13px var(--display);text-transform:capitalize}
.ag-data span{font-size:13px}
.fatos-ag{display:flex;flex-direction:column;gap:12px;margin-top:12px;font-size:14px;color:var(--marinho);overflow-wrap:anywhere}
.fatos-ag .rotulo{color:var(--legenda);display:block;margin-bottom:2px}
.slots{margin-top:14px;max-height:52vh;overflow:auto}
.slot-dia{padding:8px 0;border-top:1px solid var(--areia)}
.slot-dia:first-child{border-top:0}
.slot-dia b{display:block;font-size:13.5px;color:var(--marinho);margin-bottom:6px;text-transform:capitalize}
.motivos-adm{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opcao-larga{display:flex;gap:10px;align-items:center;border:1px solid var(--borda);border-radius:11px;padding:10px 12px;cursor:pointer}
.opcao-larga:has(input:checked){border-color:var(--marinho);box-shadow:inset 0 0 0 1px var(--marinho)}
.opcao-larga input{accent-color:var(--marinho)}
.opcao-larga b{display:block;color:var(--marinho);font-weight:600}
.opcao-larga .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

/* números e modelos, caixa de saída */
.modelo{border-top:1px solid var(--areia);padding:12px 0;display:flex;gap:12px;align-items:flex-start}
.modelo:first-child{border-top:0}
.modelo .corpo{flex:1;min-width:0}
.modelo .corpo b{font-weight:600;color:var(--marinho);font-family:ui-monospace,monospace;font-size:13.5px}
.modelo .texto{font-size:13.5px;white-space:pre-wrap;color:var(--grafite);margin-top:4px;overflow-wrap:anywhere}
.relogio-cartao{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.relogio-cartao .numero{font-size:22px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 12px}
.msg{background:var(--branco);border-radius:16px;box-shadow:var(--sombra);padding:14px 16px;margin-top:12px}
.msg-cab{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--legenda)}
.msg-cab b{color:var(--marinho);font-weight:600}
.bolha{margin-top:10px;background:#E7F6E9;border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:14px;color:#1F2D24;white-space:pre-wrap;overflow-wrap:anywhere;max-width:560px}
.bolha.email{background:var(--trilho);color:var(--marinho);border-radius:12px}
.bolha.agendada{opacity:.6}
.bolha .botoes-msg{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.bolha .botoes-msg button{border:0;background:var(--branco);color:#0B7A5B;border-radius:9999px;padding:6px 12px;font:600 13px var(--sans);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bolha .botoes-msg button[disabled]{opacity:.5;cursor:default}
.resposta{margin:8px 0 0 auto;max-width:420px;background:var(--ardosia);color:var(--marinho);border-radius:14px 4px 14px 14px;padding:8px 12px;font-size:14px;width:fit-content}
.escrever{margin-top:12px;background:var(--pessego);border-radius:12px;padding:12px 14px;max-width:560px}
.escrever .rotulo{color:var(--atencao)}
.responder{display:flex;gap:6px;margin-top:10px;max-width:560px}
.responder input{flex:1;min-width:0}

/* casco */
.casco{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:30px;padding:30px 24px 90px}
nav.menu{display:flex;flex-direction:column;gap:2px;position:sticky;top:76px;align-self:start}
nav.menu .rot{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--marinho);padding:6px 12px 8px}
nav.menu a{display:block;padding:9px 12px;border-radius:11px;color:var(--marinho);font-weight:500;font-size:14px;text-decoration:none}
nav.menu a:hover{background:var(--areia)}
nav.menu a.ativo{background:var(--marinho);color:#fff}
nav.menu .depois{padding:9px 12px;font-size:13px;color:var(--legenda)}
main{min-width:0}

/* cabeçalho de página */
.cab{margin-bottom:22px}
.rotulo{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--marinho)}
.rotulo a{color:inherit;text-decoration:none}
.rotulo a:hover{text-decoration:underline}
h1{font:600 32px/1.15 var(--display);color:var(--marinho);margin-top:6px;overflow-wrap:anywhere}
.sub{margin-top:8px;max-width:720px}
.cab-linha{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* cartões e seções */
.cartao{background:var(--branco);border-radius:16px;box-shadow:var(--sombra);padding:20px 22px}
.cartao + .cartao{margin-top:16px}
.cartao h2{font:600 17px/1.3 var(--display);color:var(--marinho)}
.cartao .h2sub{font-size:13.5px;color:var(--legenda);margin-top:2px}
.cartao-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.secao{margin-top:30px}
.secao > .rotulo{margin-bottom:10px;display:block}
.nota{font-size:13px;color:var(--legenda);line-height:1.55}
.nota + .nota{margin-top:6px}
.divisa{border:0;border-top:1px solid var(--areia);margin:16px 0}
.grade-cartoes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grade-cartoes .cartao + .cartao{margin-top:0}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:8px 12px;font:600 13px var(--sans);cursor:pointer;text-decoration:none;white-space:nowrap;background:var(--branco);color:var(--marinho);box-shadow:inset 0 0 0 1px var(--borda);transition:filter .12s,transform .08s}
.btn:hover{box-shadow:inset 0 0 0 1px var(--marinho)}
.btn:active{transform:scale(.97)}
.btn.prim{background:var(--laranja);color:var(--marinho);border-radius:9999px;padding:9px 18px;box-shadow:none}
.btn.prim:hover{filter:brightness(.94)}
.btn.terc{background:var(--pessego);box-shadow:none}
.btn.terc:hover{filter:brightness(.97)}
.btn.texto{background:none;box-shadow:none;padding:6px 8px;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.btn.perigo{color:var(--vermelho-texto)}
.btn[disabled]{opacity:.45;pointer-events:none}
.botoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* etiquetas */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:9999px;font:600 12px/1.6 var(--sans);white-space:nowrap}
.chip.ok{background:#E3F3E9;color:var(--verde-texto)}
.chip.alerta{background:#FBE6E6;color:var(--vermelho-texto)}
.chip.atencao{background:var(--pessego);color:var(--atencao)}
.chip.neutro{background:var(--areia);color:var(--legenda)}
.chip.marinho{background:var(--ardosia);color:var(--marinho)}

/* formulários */
.campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.campos .largo{grid-column:1/-1}
.campo > label,.campo > .lbl{display:block;font-size:13px;font-weight:600;color:var(--marinho);margin-bottom:4px}
.campo > label.inter{display:inline-flex;margin-bottom:0;font-size:14px;font-weight:500}
.campo .ajuda{font-size:12.5px;color:var(--legenda);margin-top:4px;line-height:1.45}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=time],input[type=date],input[type=url],select,textarea{width:100%;border:1px solid var(--borda);border-radius:11px;padding:8px 11px;background:var(--branco);color:var(--marinho);font-size:14px;min-height:38px}
textarea{min-height:76px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--marinho);outline:none;box-shadow:0 0 0 3px rgba(250,122,53,.25)}
.com-unidade{display:flex;gap:6px}
.com-unidade input{flex:1;min-width:0}
.com-unidade select{width:auto;flex:0 0 auto}
.alerta-faixa{margin-top:6px;font-size:12.5px;color:var(--vermelho-texto);background:#FBE6E6;border-radius:8px;padding:6px 10px}
.opcoes{display:flex;flex-wrap:wrap;gap:6px}
.opcao{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--borda);border-radius:8px;padding:5px 10px;font-size:13.5px;cursor:pointer;background:var(--branco);color:var(--marinho);user-select:none}
.opcao input{accent-color:var(--marinho)}
.opcao:has(input:checked){background:var(--marinho);color:#fff;border-color:var(--marinho)}
.alternancia{display:inline-flex;border:1px solid var(--borda);border-radius:11px;overflow:hidden;flex-wrap:wrap}
.alternancia button{border:0;background:var(--branco);padding:7px 14px;font-size:13px;font-weight:600;color:var(--marinho);cursor:pointer}
.alternancia button + button{border-left:1px solid var(--borda)}
.alternancia button.sim{background:var(--marinho);color:#fff}
.alternancia button[disabled]{opacity:.45;cursor:not-allowed}

/* interruptor */
.inter{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:var(--marinho);font-weight:500}
.inter input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:9999px;background:var(--borda);position:relative;cursor:pointer;flex:0 0 38px;transition:background .15s;margin:0}
.inter input::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.inter input:checked{background:var(--marinho)}
.inter input:checked::after{left:19px}
.inter input:disabled{opacity:.5;cursor:not-allowed}

/* listas */
.lista{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--areia)}
.item:first-child{border-top:0;padding-top:4px}
.item .corpo{flex:1;min-width:0}
.item .corpo b{display:block;font:600 15px/1.35 var(--display);color:var(--marinho);overflow-wrap:anywhere}
.item .corpo small{display:block;font-size:13px;color:var(--legenda);overflow-wrap:anywhere}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.item .acoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.foto{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:var(--pessego);color:var(--laranja-texto);display:inline-flex;align-items:center;justify-content:center;font:600 15px var(--display);overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}
.foto.p{width:30px;height:30px;flex-basis:30px;font-size:12px}

/* grade semanal */
.dia-grade{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--areia)}
.dia-grade:first-child{border-top:0}
.dia-grade .nome{font-weight:600;color:var(--marinho);font-size:14px;padding-top:8px}
.blocos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bloco{display:inline-flex;align-items:center;gap:4px;background:var(--trilho);border-radius:11px;padding:4px 6px}
.bloco input{width:auto;min-height:32px;padding:4px 6px;border-color:transparent;background:var(--branco)}
.x{border:0;background:none;color:var(--legenda);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{background:var(--areia);color:var(--marinho)}
.vazio-dia{font-size:13px;color:var(--legenda)}

/* pessoas e pesos */
.pesos .linha{display:grid;grid-template-columns:minmax(0,1fr) 112px auto 34px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--areia)}
.pesos .linha:first-child{border-top:0}
.pesos .quem{display:flex;align-items:center;gap:10px;min-width:0}

<script id="motor-agenda">
// ===================== MOTOR DA AGENDA: as regras do agendamento, sem tela =====================
// Especificação: area-logada/AGENDAMENTO.md. Este bloco é a referência das regras que o desenvolvedor leva para a
// plataforma; as telas (agendamento.html, agendar.html e o encaixe em area-cliente.html) carregam a mesma cópia,
// passada pelo sync-motor.js, e o verificar-agenda.js o roda em Node.
// O estado é um objeto com uma coleção por documento do modelo de dados (agPessoas, agTipos…), cada uma indexada pelo
// id. As operações mudam o estado em memória e devolvem `escritas` (os documentos tocados), que a tela grava no
// armazém. Nada aqui tem tipo, pessoa, peso, duração ou lembrete: tudo vem do cadastro.
// O que está fora do navegador é simulado em pontos marcados "SIMULADO": o livre/ocupado e os eventos do calendário
// (na plataforma, Google e Microsoft) e o link da videoconferência.
// Datas e horas em UTC (ISO); durações e prazos em minutos; a grade e as exceções no fuso de cada pessoa.
const AGENDA = (() => {
  const MIN = 60000, DIA = 1440 * MIN;
  const BRASILIA = 'America/Sao_Paulo';   // o ciclo da distribuição conta em horário de Brasília; fuso de quem não informou
  const RESERVA_MIN = 5;                  // o horário escolhido fica reservado por 5 minutos
  const REMARCAR_DIAS = 7;                // remarcação: sem horário da mesma pessoa em 7 dias, oferece os do grupo
  const COLECOES = {
    pessoas: 'agPessoas', tipos: 'agTipos', remetentes: 'agRemetentes', agendamentos: 'agAgendamentos',
    liberacoes: 'agLiberacoes', links: 'agLinks', reservas: 'agReservas', mensagens: 'agMensagens',
    calendarios: 'agCalendarios', contatos: 'agContatos', saldos: 'agSaldos', config: 'agConfig',   // os quatro últimos só no protótipo (simulações)
    clientes: 'agClientes',   // simulação do login: quem é cada cliente (público, empresa, consultor); na plataforma, a sessão
  };
  const VALE = new Set(['marcado', 'realizado']);   // o que trava a agenda e entra na conta da distribuição
  const estadoVazio = () => { const e = {}; for (const k in COLECOES) e[k] = {}; return e; };

  // ---------- tempo e fuso ----------
  const ms = v => v == null || v === '' ? NaN : typeof v === 'number' ? v : Date.parse(v);
  const iso = t => new Date(t).toISOString();
  const pad = n => String(n).padStart(2, '0');
  const hm = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + (m || 0); };
  const fmts = {};
  const fmt = (tz, chave, o) => fmts[chave + tz] || (fmts[chave + tz] = new Intl.DateTimeFormat(chave === 'p' ? 'en-US' : 'pt-BR', Object.assign({ timeZone: tz }, o)));
  const DOW = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  function partes(t, tz) {
    const o = {};
    for (const p of fmt(tz, 'p', { hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short' }).formatToParts(new Date(t))) o[p.type] = p.value;
    return { a: +o.year, m: +o.month, d: +o.day, h: +o.hour % 24, mi: +o.minute, s: +o.second, dow: DOW[o.weekday] };
  }
  const deslocamento = (t, tz) => { const p = partes(t, tz); return (Date.UTC(p.a, p.m - 1, p.d, p.h, p.mi, p.s) - Math.floor(t / 1000) * 1000) / MIN; };
  // a hora local (dia + minutos desde a meia-noite) num fuso → o instante UTC
  function deLocal(a, m, d, minutos, tz) {
    const g = Date.UTC(a, m - 1, d) + minutos * MIN;
    const t = g - deslocamento(g, tz) * MIN;
    return g - deslocamento(t, tz) * MIN;
  }
  const dataLocal = (t, tz) => { const p = partes(ms(t), tz); return p.a + '-' + pad(p.m) + '-' + pad(p.d); };
  const formatarData = (t, tz) => fmt(tz || BRASILIA, 'd', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(ms(t)));
  const formatarHora = (t, tz) => fmt(tz || BRASILIA, 'h', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(ms(t)));
  function diasEntre(ini, fim, tz) {
    const a = partes(ini, tz), b = partes(fim, tz), r = [];
    for (let t = Date.UTC(a.a, a.m - 1, a.d), tf = Date.UTC(b.a, b.m - 1, b.d); t <= tf; t += DIA) {
      const d = new Date(t);
      r.push({ a: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), dow: d.getUTCDay(), chave: d.toISOString().slice(0, 10), semana: new Date(t - ((d.getUTCDay() + 6) % 7) * DIA).toISOString().slice(0, 10) });
    }
    return r;
  }
  const somaMeses = (t, n) => { const d = new Date(t); d.setUTCMonth(d.getUTCMonth() + n); return d.getTime(); };
  function inicioDoCiclo(ciclo, agora) {
    if (ciclo === 'continuo') return -Infinity;
    const p = partes(agora, BRASILIA);
    const m = ciclo === 'trimestre' ? Math.floor((p.m - 1) / 3) * 3 + 1 : p.m;
    return deLocal(p.a, m, 1, 0, BRASILIA);
  }

  // ---------- ids e sorteio ----------
  const LETRAS = 'abcdefghjkmnpqrstuvwxyz23456789';
  const novoId = (rng, n) => { let s = ''; for (let i = 0; i < (n || 10); i++) s += LETRAS[Math.floor((rng || Math.random)() * LETRAS.length)]; return s; };
  const copia = v => v == null ? v : JSON.parse(JSON.stringify(v));
  function novaTx(estado) {
    const toc = new Map();
    return {
      put(col, doc) { estado[col][doc.id] = doc; toc.set(col + '/' + doc.id, { col, id: doc.id }); return doc; },
      del(col, id) { delete estado[col][id]; toc.set(col + '/' + id, { col, id, apagado: true }); },
      get escritas() { return [...toc.values()]; },
    };
  }

  // ---------- pessoas ----------
  // ok | inativo | sem_calendario | quebrado. Quem tem um calendário conferido com a conexão quebrada sai dos grupos.
  function situacaoPessoa(estado, pid) {
    const p = estado.pessoas[pid];
    if (!p || p.ativo === false) return 'inativo';
    const cal = p.calendarios || [];
    if (cal.some(c => c.estado === 'quebrado' && c.confere !== false)) return 'quebrado';
    if (!cal.some(c => c.estado === 'conectado')) return 'sem_calendario';
    return 'ok';
  }
  const elegivel = (estado, pid) => situacaoPessoa(estado, pid) === 'ok';
  // quem pode atender este pedido: o consultor do cliente, uma pessoa só (remarcação) ou as habilitadas e participando
  function candidatos(estado, tipo, op) {
    if (op && op.soPessoa) return elegivel(estado, op.soPessoa) ? [op.soPessoa] : [];
    if (tipo.atende === 'consultorDoCliente') return op && op.consultor && elegivel(estado, op.consultor) ? [op.consultor] : [];
    return (tipo.pessoas || []).filter(x => x.participando !== false && elegivel(estado, x.pessoa)).map(x => x.pessoa);
  }

  // ---------- livre e ocupado ----------
  // SIMULADO: os compromissos de fora vêm de agCalendarios/<pessoa>.ocupados; na plataforma, do livre/ocupado do
  // Google e do Microsoft, de todos os calendários com "confere". As reuniões da ferramenta travam com os intervalos.
  function ocupacoes(estado, pid, ignorar) {
    const r = ((estado.calendarios[pid] || {}).ocupados || []).map(o => { const i = ms(o.inicio), f = ms(o.fim); return { i, f, ib: i, fb: f }; });
    for (const a of Object.values(estado.agendamentos)) {
      if (a.id === ignorar || !VALE.has(a.estado) || (a.atende !== pid && !(a.adicionais || []).includes(pid))) continue;
      const g = a.regras || {}, i = ms(a.inicio), f = ms(a.fim);
      r.push({ i, f, ib: i - (g.antes || 0) * MIN, fb: f + (g.depois || 0) * MIN });
    }
    return r;
  }
  const choca = (ocup, t0, t1, antes, depois) => {
    const b0 = t0 - antes * MIN, b1 = t1 + depois * MIN;
    return ocup.some(o => (b0 < o.f && o.i < b1) || (t0 < o.fb && o.ib < t1));
  };
  function blocosDoDia(p, tipo, dia) {
    const ex = (p.excecoes || []).find(e => e.data === dia.chave);
    const lista = bl => (bl || []).map(b => [hm(b.de), hm(b.ate)]).filter(b => b[1] > b[0]);
    let bl = lista(ex ? (ex.folga ? [] : ex.blocos) : (p.grade || {})[dia.dow]);
    const tg = tipo.grade && Object.values(tipo.grade).some(v => v && v.length) ? lista(tipo.grade[dia.dow]) : null;
    if (tg) { const r = []; for (const [a0, a1] of bl) for (const [b0, b1] of tg) { const i = Math.max(a0, b0), f = Math.min(a1, b1); if (f > i) r.push([i, f]); } bl = r; }
    return bl;
  }
  function contagens(estado, tipoId, pid, tz, ignorar) {
    const dia = {}, semana = {};
    for (const a of Object.values(estado.agendamentos)) {
      if (a.id === ignorar || a.tipo !== tipoId || a.atende !== pid || !VALE.has(a.estado)) continue;
      const d = diasEntre(ms(a.inicio), ms(a.inicio), tz)[0];
      dia[d.chave] = (dia[d.chave] || 0) + 1; semana[d.semana] = (semana[d.semana] || 0) + 1;
    }
    return { dia, semana };
  }
  // os inícios em que esta pessoa pode atender este tipo, entre ini e fim (ms)
  function horariosDaPessoa(estado, tipo, pid, ini, fim, op) {
    const p = estado.pessoas[pid]; if (!p || !(tipo.duracao > 0)) return [];
    const tz = p.fuso || BRASILIA, dur = tipo.duracao, antes = tipo.antes || 0, depois = tipo.depois || 0;
    const ocup = ocupacoes(estado, pid, op.ignorar), cont = contagens(estado, tipo.id, pid, tz, op.ignorar);
    const inicios = [...new Set((tipo.inicios || []).map(Number))].sort((a, b) => a - b), r = [];
    for (const dia of diasEntre(ini, fim, tz)) {
      if (tipo.limiteDia && (cont.dia[dia.chave] || 0) >= tipo.limiteDia) continue;
      if (tipo.limiteSemana && (cont.semana[dia.semana] || 0) >= tipo.limiteSemana) continue;
      for (const [b0, b1] of blocosDoDia(p, tipo, dia)) for (let h = Math.floor(b0 / 60); h * 60 < b1; h++) for (const m of inicios) {
        const s = h * 60 + m; if (s < b0 || s + dur > b1) continue;
        const t = deLocal(dia.a, dia.m, dia.d, s, tz);
        if (t < ini || t > fim || choca(ocup, t, t + dur * MIN, antes, depois)) continue;
        r.push(t);
      }
    }
    return r;
  }
  function adicionalLivre(estado, tipo, pid, t, op) {
    if (situacaoPessoa(estado, pid) !== 'ok') return false;
    return !choca(ocupacoes(estado, pid, op.ignorar), t, t + tipo.duracao * MIN, tipo.antes || 0, tipo.depois || 0);
  }
  // O cálculo dos horários livres de um tipo, de op.de a op.ate. Cada horário traz as pessoas livres nele, para a
  // distribuição; a página de quem agenda mostra só inicio e fim (horariosPublicos).
  // op: agora, de, ate, consultor (consultorDoCliente), soPessoa (remarcação), ignorar (o agendamento sendo
  // remarcado), reserva (a reserva de quem pergunta, que não conta contra ele).
  function horariosLivres(estado, tipoId, op) {
    const tipo = estado.tipos[tipoId]; if (!tipo || !(tipo.duracao > 0)) return [];
    const agora = ms(op.agora);
    const ini = Math.max(ms(op.de != null ? op.de : agora), agora + (tipo.antecedencia || 0) * MIN);
    const fim = Math.min(ms(op.ate), tipo.janelaDias ? agora + tipo.janelaDias * DIA : Infinity);
    if (!(fim >= ini)) return [];
    const mapa = new Map();
    for (const pid of candidatos(estado, tipo, op)) for (const t of horariosDaPessoa(estado, tipo, pid, ini, fim, op)) { if (!mapa.has(t)) mapa.set(t, []); mapa.get(t).push(pid); }
    const reservas = Object.values(estado.reservas).filter(r => r.id !== op.reserva && ms(r.expiraEm) > agora);
    const res = [];
    for (const [t, ps] of [...mapa].sort((a, b) => a[0] - b[0])) {
      const tf = t + tipo.duracao * MIN;
      if ((tipo.adicionais || []).some(aid => !adicionalLivre(estado, tipo, aid, t, op))) continue;
      // cada reserva de outra pessoa que bate neste horário segura uma das pessoas livres
      // a reserva de outra pessoa que bate neste horário segura quem foi escolhido para ela
      const presas = new Set(reservas.filter(r => ms(r.inicio) < tf && t < ms(r.fim)).map(r => r.pessoa));
      const livresAqui = ps.filter(p => !presas.has(p));
      if (!livresAqui.length) continue;
      res.push({ inicio: iso(t), fim: iso(tf), pessoas: livresAqui });
    }

              for (const id in estado[col]) if (!(id in novo)) delete estado[col][id];
              Object.assign(estado[col], novo);
              if (!primeiro) avisa(); fim();
            }, fim);
            setTimeout(fim, 8000);
          })));
          return { modo: 'nuvem' };
        }
      }
      lerLocal();
      addEventListener('storage', e => {
        const m = e.key && e.key.match(/^nl-db:(ag[A-Za-z]+)\/(.+)$/); if (!m || !DE_NOME[m[1]]) return;
        if (e.newValue == null) delete estado[DE_NOME[m[1]]][m[2]]; else ler(DE_NOME[m[1]], m[2], e.newValue);
        avisa();
      });
      return { modo: 'local' };
    })();
    return info;
  }
  // grava os documentos tocados (as `escritas` do motor, ou { col, id } de uma edição do painel)
  async function gravar(escritas) {
    const em = new Date().toISOString();
    for (const w of escritas || []) {
      const doc = w.apagado ? null : estado[w.col][w.id];
      if (!db) { try { if (doc == null) localStorage.removeItem(chave(w.col, w.id)); else localStorage.setItem(chave(w.col, w.id), JSON.stringify({ dados: doc, em })); } catch (e) { } continue; }
      const ref = db.doc(COL[w.col] + '/' + w.id);
      if (doc == null) await ref.delete(); else await ref.set({ dados: JSON.parse(JSON.stringify(doc)), em });
    }
  }
  async function apagarTudo() {
    const escritas = [];
    for (const col in COL) for (const id of Object.keys(estado[col])) { delete estado[col][id]; escritas.push({ col, id, apagado: true }); }
    await gravar(escritas);
  }
  // SIMULADO: o relógio. ?hoje=AAAA-MM-DDTHH:MM (horário de Brasília) faz o tempo andar a partir dali.
  // "Avançar o tempo", no painel, guarda o deslocamento em agConfig/relogio, e as duas telas leem o mesmo relógio.
  const relogio = (() => {
    const q = typeof location !== 'undefined' ? new URLSearchParams(location.search).get('hoje') : null;
    const base = q ? Date.parse(q.length <= 16 ? q + ':00-03:00' : q) : NaN, t0 = Date.now();
    const desloca = () => Number((estado.config.relogio || {}).deslocamento) || 0;
    return { agora: () => (isNaN(base) ? Date.now() : base + (Date.now() - t0)) + desloca(), get deslocamento() { return desloca(); }, fixado: !isNaN(base) };
  })();
  return { iniciar, estado, gravar, apagarTudo, ouvir: f => ouvintes.push(f), relogio, get nuvem() { return !!db; } };
})();
</script>

<script>

function emUnidade(min) {
  if (min == null || min === '') return { n: '', u: 1 };
  for (const [u] of UNIDADES.slice().reverse()) if (min % u === 0 && min >= u) return { n: min / u, u };

}

}
const ultimoAdmin = p => p.papel === 'admin' && lista(E.pessoas).filter(x => x.papel === 'admin' && x.ativo !== false).length <= 1;
function janelaPessoa(id) {

    <form id="formPessoa" class="campos" style="margin-top:16px" autocomplete="off">

        <div class="ajuda">${travado ? 'É a única admin: para mudar, torne outra pessoa admin antes.' : 'O admin faz tudo o que o consultor faz, e mexe em tipos, pessoas, pesos e papéis.'}</div></div>

    </form>
    ${id ? historicoHtml(p) : ''}
    <div class="rodape"><button class="btn" data-fechar>Cancelar</button><button class="btn prim" id="fpSalvar">Salvar</button></div>`, f => {
    let novaFoto = p.foto || '';

    const des = f.querySelector('#fpDesativar'); if (des) des.addEventListener('click', () => desativar(id));
    const rea = f.querySelector('#fpReativar'); if (rea) rea.addEventListener('click', async () => { const q = E.pessoas[id]; q.ativo = true; await salvar('pessoas', q, 'reativou a pessoa'); fecharJanela(); desenhar(); });
    const enviar = async ev => {

      if (!nome || !/^\S+@\S+\.\S+$/.test(email)) { avisar('Preencha o nome e um e-mail válido.'); return; }

      if (!travado) doc.papel = papel;

}

// SIMULADO: o convite vai para a fila de mensagens; a caixa de saída (passo 4) mostra como chegaria
async function convidar(p) {
  p.convite = Object.assign({}, p.convite, { enviadoEm: isoAgora() });
  const id = 'cv' + A.novoId();
  E.mensagens[id] = { id, agendamento: null, evento: 'convite', para: p.id, canal: 'email', destino: p.email, remetente: '', modelo: '',
    texto: 'Olá, ' + p.nome.split(' ')[0] + '. Você foi convidado para atender reuniões pela Nord Liberta. Entre no painel e conecte o seu calendário: ' + new URL('agendamento.html#agenda', location.href).href,
    enviarEm: isoAgora(), enviadoEm: isoAgora(), estado: 'enviada', botoes: [] };
  await AR.gravar([{ col: 'pessoas', id: p.id }, { col: 'mensagens', id }]);
}
function reduzirFoto(arq) {
  return new Promise(ok => {
    const img = new Image(), url = URL.createObjectURL(arq);
    img.onload = () => {

function semanaTipica(pid, segunda, rnd) {

  const titulos = ['Ocupado', 'Reunião interna', 'Almoço', 'Comitê', 'Particular'];
  rnd = rnd || Math.random; cal.ocupados = cal.ocupados || [];

      cal.ocupados.push({ inicio: new Date(A.deLocal(d.a, d.m, d.d, ini, tz)).toISOString(), fim: new Date(A.deLocal(d.a, d.m, d.d, ini + dur, tz)).toISOString(), titulo: titulos[Math.floor(rnd() * titulos.length)] });

    ${doGrupo ? '<p class="nota" style="margin-top:8px">Os horários com · são de outras pessoas do grupo.</p>' : ''}

// ===================== O RELÓGIO =====================
// SIMULADO: na plataforma, um agendador de tarefas. Aqui o painel faz esse papel: ao abrir, a cada 20 segundos e ao
// avançar o tempo, envia o que venceu e solta as reservas vencidas (AGENDA.relogio).
async function rodarRelogio() {
  const antes = lista(E.mensagens).filter(m => m.estado === 'enviada').length;
  const r = A.relogio(E, { agora: agora() });
  if (!r.escritas.length) return 0;
  await AR.gravar(r.escritas);
  return lista(E.mensagens).filter(m => m.estado === 'enviada').length - antes;
}
async function moverRelogio(novo) {
  const c = E.config.relogio || { id: 'relogio', deslocamento: 0 };
  c.deslocamento = Math.max(0, novo); E.config.relogio = c;
  await AR.gravar([{ col: 'config', id: 'relogio' }]);
  const n = await rodarRelogio();
  desenhar();
  avisar(n ? n + (n > 1 ? ' mensagens saíram.' : ' mensagem saiu.') : 'Nenhuma mensagem venceu até aqui.');
}
const proximoEnvio = () => lista(E.mensagens).filter(m => m.estado === 'agendada' && visivelNaCaixa(m)).map(m => Date.parse(m.enviarEm)).sort((a, b) => a - b)[0];
function textoDeslocamento(ms) {
  if (!ms) return '';
  const d = Math.floor(ms / DIA), h = Math.floor(ms % DIA / 3600000), m = Math.round(ms % 3600000 / MIN);
  return [d && d + (d > 1 ? ' dias' : ' dia'), h && h + 'h', !d && m && m + ' min'].filter(Boolean).join(' ');
}

// ===================== CAIXA DE SAÍDA =====================
// SIMULADO: nada é enviado. Cada mensagem aparece como chegaria, com o número que enviou e a hora; os botões e as
// respostas funcionam (AGENDA.responder).
let FILTRO_CAIXA = 'enviadas';
const EVENTO_MSG = { agendou: 'Confirmação', remarcou: 'Remarcação', cancelou: 'Cancelamento', naoCompareceu: 'Não compareceu', lembrete: 'Lembrete', resposta: 'Resposta', convite: 'Convite para a equipe', modelo: 'Aviso aos admins' };
function visivelNaCaixa(m) {
  if (souAdmin()) return true;
  const ag = E.agendamentos[m.agendamento];
  return m.para === EU || (ag && ag.atende === EU);
}
function telaCaixa() {
  const desloc = AR.relogio.deslocamento, prox = proximoEnvio();
  const todas = lista(E.mensagens).filter(visivelNaCaixa), n = { enviadas: 0, agendadas: 0, canceladas: 0 };
  n.preencher = 0;
  todas.forEach(m => { if (m.estado === 'enviada') n.enviadas++; else if (m.estado === 'agendada') n.agendadas++; else if (m.estado === 'cancelada') n.canceladas++; if (esperaTexto(m)) n.preencher++; });
  const filtradas = todas.filter(m => FILTRO_CAIXA === 'todas' || (FILTRO_CAIXA === 'enviadas' ? m.estado === 'enviada' : FILTRO_CAIXA === 'agendadas' ? m.estado === 'agendada' : FILTRO_CAIXA === 'preencher' ? esperaTexto(m) : m.estado === 'cancelada'))
    .sort((a, b) => FILTRO_CAIXA === 'agendadas' ? a.enviarEm.localeCompare(b.enviarEm) : (b.enviadoEm || b.enviarEm).localeCompare(a.enviadoEm || a.enviarEm));
  const filtro = (k, nome, q) => `<button class="btn${FILTRO_CAIXA === k ? ' prim' : ''}" style="${FILTRO_CAIXA === k ? 'padding:8px 14px' : ''}" data-acao="caixa-filtro" data-f="${k}">${nome}${q != null ? ' · ' + q : ''}</button>`;
  return `<div class="cab"><div class="rotulo">Simulação</div><h1>Caixa de saída</h1>
      <p class="sub">Nada sai de verdade: cada mensagem aparece aqui como chegaria no WhatsApp ou no e-mail. Os botões funcionam, e dá para responder como o cliente.</p></div>
    <div class="cartao relogio-cartao"><div><span class="rotulo">Agora, na simulação</span><div class="numero" style="margin-top:4px">${esc(dataHora(isoAgora()))}</div>
        <p class="nota">${desloc ? 'Adiantado ' + esc(textoDeslocamento(desloc)) + ' em relação ao relógio de verdade.' : 'No horário de verdade.'}${prox ? ' Próximo envio: ' + esc(dataHora(new Date(prox).toISOString())) + '.' : ''}</p></div>
      <div class="botoes"><button class="btn" data-acao="relogio" data-ms="3600000">+1 hora</button><button class="btn" data-acao="relogio" data-ms="${DIA}">+1 dia</button><button class="btn" data-acao="relogio" data-ms="${7 * DIA}">+1 semana</button>
        ${prox ? `<button class="btn terc" data-acao="relogio-proximo">Até o próximo envio</button>` : ''}${desloc ? '<button class="btn texto" data-acao="relogio-real">Voltar ao horário de verdade</button>' : ''}</div></div>
    <div class="filtros">${n.preencher || FILTRO_CAIXA === 'preencher' ? filtro('preencher', 'Para escrever', n.preencher) : ''}${filtro('enviadas', 'Enviadas', n.enviadas)}${filtro('agendadas', 'Agendadas', n.agendadas)}${filtro('canceladas', 'Canceladas', n.canceladas)}${filtro('todas', 'Todas')}</div>
    ${filtradas.map(cartaoMensagem).join('') || `<div class="cartao"><p class="nota">${FILTRO_CAIXA === 'preencher' ? 'Nada para escrever.' : FILTRO_CAIXA === 'agendadas' ? 'Nenhuma mensagem esperando a hora.' : 'Nenhuma mensagem aqui ainda. Agende pela página do link e elas aparecem.'}</p></div>`}`;
}
// a mensagem que espera o consultor escrever um campo da reunião
const esperaTexto = m => ['agendada', 'aguardando'].includes(m.estado) && (m.aguarda || []).length > 0;
function formCampos(m, ag) {
  const campos = A.camposDaReuniao(E, ag.id).filter(c => (m.aguarda || []).includes(c.rotulo));
  return `<div class="escrever"><span class="rotulo">${m.estado === 'aguardando' ? 'Esperando o texto para sair' : 'Para escrever antes de sair'}</span>${campos.map((c, k) => `<div class="campo" style="margin-top:8px"><label for="cmp-${esc(m.id)}-${k}">${esc(c.rotulo)}${c.vaiAoCliente ? ' <span class="nota">(o cliente lê)</span>' : ''}</label><textarea id="cmp-${esc(m.id)}-${k}" data-campo-rotulo="${esc(c.rotulo)}" rows="3">${esc(c.texto)}</textarea></div>`).join('')}

function cartaoMensagem(m) {
  const ag = E.agendamentos[m.agendamento], rem = E.remetentes[m.remetente];

  E.calendarios[p.id] = { id: p.id, ocupados: [], eventos: [] };
  await salvar('pessoas', p, 'primeira pessoa: admin');
  await AR.gravar([{ col: 'calendarios', id: p.id }]);
  entrarComo(p.id, '#agenda');
  avisar('Você é a admin. Conecte o seu calendário e diga em que horários atende.');
});

// outra aba ou outra pessoa mudou algo: redesenha, sem tirar o que alguém está digitando
AR.ouvir(() => {
  const a = document.activeElement;
  if (a && a.closest && a.closest('main,.janela') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { pendente = true; return; }
  if (!$('#fundo')) desenhar();
});
document.addEventListener('focusout', () => setTimeout(() => { if (pendente && !$('#fundo')) desenhar(); }, 0));
addEventListener('hashchange', () => { desenhar(); scrollTo(0, 0); });

AR.iniciar().then(async () => {
  await rodarRelogio(); desenhar();
  // o painel faz o papel do agendador de tarefas: o que vence enquanto ele está aberto sai sozinho
  setInterval(async () => { if (await rodarRelogio() && rota().aba === 'caixa' && !$('#fundo')) desenhar(); }, 20000);
}).catch(err => { console.error(err); $('#main').innerHTML = '<div class="cartao">Não consegui abrir os dados do agendamento. Recarregue a página.</div>'; });
</script>
<script id="casca-consultor">
// ===================== CASCA DO CONSULTOR: a mesma navegação em toda tela do consultor =====================
// As telas são autocontidas, então este bloco é copiado igual em cada uma (a fonte é o index.html; o sync-motor.js copia
// para as outras). Ele preenche o elemento [data-casca] da tela com as mesmas ligações: a base de clientes, o pipeline, a
// agenda e, com um cliente no endereço (?cliente=<id>), a ficha, a coleta, a montagem, o relatório, a área do cliente e
// o acompanhamento. data-casca="faixa" é a faixa do alto; "lateral", a lista dentro de um menu escuro (o portal).
// As telas que também são do cliente (o acompanhamento) só ganham a casca quando é o consultor que abre (&consultor).
(() => {
  const alvo = document.querySelector('[data-casca]'); if (!alvo) return;
  const q = new URLSearchParams(location.search), cli = q.get('cliente'), pag = location.pathname.split('/').pop() || 'index.html';
  const doConsultor = ['index.html', 'tela-consultor.html', 'agendamento.html'].includes(pag) || q.has('consultor');
  if (!doConsultor) { alvo.hidden = true; return; }
  const c = cli ? '?cliente=' + encodeURIComponent(cli) : '';
  const aqui = pag === 'index.html' ? 'base' : pag === 'tela-consultor.html' ? (q.has('coleta') ? 'coleta' : 'plano') : pag === 'agendamento.html' ? 'agenda' : pag === 'acompanhamento.html' ? 'acomp' : pag === 'area-cliente.html' ? 'area' : pag === 'evolucao-patrimonial.html' ? 'relatorio' : null;
  const gerais = [['base', 'Base de clientes', 'index.html'], ['pipeline', 'Pipeline', 'index.html#pipeline'], ['agenda', 'Agenda', 'agendamento.html']];
  const doCliente = !cli ? [] : [['ficha', 'Ficha', 'index.html#cliente/' + encodeURIComponent(cli)], ['coleta', 'Coleta', 'tela-consultor.html' + c + '&coleta'], ['plano', 'Montar o plano', 'tela-consultor.html' + c],
    ['relatorio', 'Relatório', 'evolucao-patrimonial.html' + c + '&consultor'], ['area', 'Área do cliente', 'area-cliente.html' + c + '&consultor'], ['acomp', 'Acompanhamento', 'acompanhamento.html' + c + '&consultor']];
  let nome = '';
  if (cli) try { for (const k of ['planos/', 'versoes/']) { const d = (JSON.parse(localStorage.getItem('nl-db:' + k + cli) || 'null') || {}).dados, p = d && (d.lista ? (d.lista[0] || {}).dados : d); if (p && p.name) { nome = p.name; break; } } } catch (e) { }
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const link = ([id, n, h]) => `<a href="${h}"${id === aqui ? ' aria-current="page"' : ''}>${n}</a>`;
  if (!document.getElementById('casca-estilo')) { const st = document.createElement('style'); st.id = 'casca-estilo';
    st.textContent = `[data-casca]{font:500 13px 'DM Sans',system-ui,sans-serif}
[data-casca] a{color:rgba(255,255,255,.78);text-decoration:none;white-space:nowrap;padding:6px 10px;border-radius:8px;transition:background .15s,color .15s}
[data-casca] a:focus-visible{outline:2px solid #FA7A35;outline-offset:1px}
[data-casca] a:hover{color:#fff;background:rgba(255,255,255,.1)}
[data-casca] a[aria-current=page]{color:#fff;background:rgba(255,255,255,.16)}
[data-casca] .cc-cli{color:rgba(255,255,255,.55);padding:5px 4px 5px 10px;white-space:nowrap}
[data-casca=faixa]{display:flex;align-items:center;gap:2px;background:#20344C;border-bottom:1px solid rgba(255,255,255,.12);padding:7px 20px;overflow-x:auto;scrollbar-width:none}
[data-casca=faixa] img{width:24px;height:24px;margin-right:10px;flex:none}
[data-casca=faixa]:has(+ header img) img{display:none}   /* a tela que já tem a marca no próprio cabeçalho não a repete */
[data-casca=faixa] .cc-sep{flex:0 0 1px;align-self:stretch;background:rgba(255,255,255,.18);margin:4px 8px}
[data-casca=lateral]{display:flex;flex-wrap:wrap;gap:2px;margin-top:10px}
[data-casca=lateral] a{padding:4px 8px;font-size:12.5px;background:rgba(255,255,255,.06)}
[data-casca=lateral] .cc-sep{flex:0 0 100%;height:4px}
[data-casca=lateral] .cc-cli,[data-casca=lateral] img,[data-casca=lateral] a:first-of-type{display:none}   /* no portal, a base já é o botão acima */
body.recolhido [data-casca=lateral]{display:none}
@media (max-width:600px){[data-casca=faixa]{padding:7px 12px}}
@media (prefers-reduced-motion:reduce){[data-casca] a{transition:none}}
@media print{[data-casca]{display:none!important}}`;
    document.head.appendChild(st); }
  alvo.setAttribute('aria-label', 'Área do consultor');
  alvo.innerHTML = `<img src="marca/nord-icone-negativo-64.png" alt="Nord Liberta">${gerais.map(link).join('')}${doCliente.length ? `<span class="cc-sep"></span>${nome ? `<span class="cc-cli">${esc(nome)}</span>` : ''}${doCliente.map(link).join('')}` : ''}`;
})();
</script>
